name: fuxi iOS 17 Grand-Slam (Kerfand f0ae963 + all local enhancements)

# Reconstructs Kerfand's latest snapshot via tools/reconstruct.sh (Safari, keyboard 3-piece,
# Adreno740 1c9029b + AdrenoMetal c9ebd2fb + scanout_scale, Wi-Fi DMA cache, PPS/PD fast charge,
# Audio/buttons, 8-core support, RTC/timezone, DPU direct + GPU handoff, zz-protection-class-none)
# and layers our verified local additions: FuxiHwdt (fuxi-hwdt=20), #10 nodim, #11 apps union,
# QUD reboot/rstfix, 16 KiB USB log ring, and smart FuxiStatusBar-14p-120hz.c.

on:
  workflow_dispatch:
    inputs:
      kerfand_ref:
        description: Kerfand/UniXNU-Fuxi-Arm64e-iOS17 ref (with tools/reconstruct.sh)
        required: true
        default: f0ae963b674c53a9c1fa5836bfcf89d38bbf77c9
      build_kernel:
        description: Build the kernel
        type: boolean
        default: true
      build_addon:
        description: Build kernel.macho.gpuaddon (Turnip, Metal plugin, FuxiStatusBar-14p-120hz, trust)
        type: boolean
        default: true
      runner:
        description: macOS runner label
        required: true
        default: macos-26

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  AGE_RECIPIENT: age10kh2jlkf7c3hcnuylu9l7gmzly9z6d983ez2epawumlu7fz4myrqj6de0n
  IPSW_URL: https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-79094/90CE304F-6C16-402E-96C9-89260D93CA82/iPhone15,2_17.7_21H16_Restore.ipsw

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ ! -d "$DEVELOPER_DIR" ]; then
            X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"; echo "using $X"
          fi

      - uses: actions/checkout@v4
        with:
          path: ci-self
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Kerfand/UniXNU-Fuxi-Arm64e-iOS17
          ref: ${{ inputs.kerfand_ref }}
          path: kerfand
          persist-credentials: false

      - name: reconstruct full Kerfand tree (tools/reconstruct.sh)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Avoid anonymous GitHub clone refusal on shared runners.
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash kerfand/tools/reconstruct.sh "$GITHUB_WORKSPACE"
          git -C UniXNU log --oneline -5
          git -C UniXNU/drivers/Adreno740 log --oneline -3
          git -C UniXNU/drivers/AdrenoMetal log --oneline -3
          git -C UniXNU/drivers/GopFramebuffer log --oneline -3
          git -C UniXNU/drivers/ArmCpu log --oneline -2
          # Ensure zz-msg-probe.patch doesn't duplicate ipc_kmsg.c include on xnu-10063.141.1
          if [ -f UniXNU/patches/xnu-10063-arm64e/zz-msg-probe.patch ]; then
            python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/zz-msg-probe-fix.py" UniXNU/patches/xnu-10063-arm64e/zz-msg-probe.patch || true
          fi

      - name: prepare device, DataSkel stub, QUD git pin, WiFi/BT sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 1) Minimal DataSkel21H16.h stub (Apple bytes stay out of public repos)
          if [ ! -f device/package/DataSkel21H16.h ]; then
            cat > device/package/DataSkel21H16.h <<'H'
          struct sheng_skel_entry { const char *path; unsigned short mode; unsigned short uid, gid; unsigned char kind; unsigned short size; const char *data; };
          static const struct sheng_skel_entry sheng_skel_21h16[] = {
           {"/private/var/db", 0755, 0, 0, 0, 0, 0},
          };
          #ifndef SKEL_PATH
          #define SKEL_PATH(e) ((e)->path)
          #define SKEL_DATA(e) ((e)->data)
          #endif
          H
          fi

          # 2) QcomXnuUsbDebug real git checkout at QUD_REVISION + Kerfand overlay + author reboot fix
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost
          QUD=$(sed -n "s/^QUD_REVISION = '\([0-9a-f]*\)'.*/\1/p" device/scripts/prepare-fuxi-usb-debug.py)
          git clone -q https://github.com/xiaoleGun/QcomXnuUsbDebug.git "$RUNNER_TEMP/qud"
          git -C "$RUNNER_TEMP/qud" checkout -q "$QUD"
          cp -R device/drivers/QcomXnuUsbDebug/. "$RUNNER_TEMP/qud/"
          rm -rf device/drivers/QcomXnuUsbDebug
          mv "$RUNNER_TEMP/qud" device/drivers/QcomXnuUsbDebug
          if ! grep -q dwc3_failure_state device/drivers/QcomXnuUsbDebug/usb/Dwc3.c; then
            git -C device/drivers/QcomXnuUsbDebug apply --verbose "$GITHUB_WORKSPACE/ci-self/.github/fuxi/qud-author-reboot-fix.patch"
          fi
          grep -c dwc3_failure_state device/drivers/QcomXnuUsbDebug/usb/Dwc3.c

          # 3) Init single-commit git repos for device and drivers so build scripts can call git rev-parse HEAD
          for r in device/drivers/*/ device/kits/*/ device; do
            [ -d "$r" ] || continue
            [ -e "$r/.git" ] && continue
            git -C "$r" init -q && git -C "$r" add -A && git -C "$r" commit -q -m "Kerfand ${{ inputs.kerfand_ref }}" && echo "git: $r"
          done

          # 4) Ath12kWifiLegacy Linux/FreeBSD deps
          if [ ! -f device/drivers/Ath12kWifiLegacy/deps/linux/drivers/bus/mhi/host/boot.c ]; then
            for i in 1 2 3; do
              bash device/drivers/Ath12kWifiLegacy/tools/fetch-sources.sh && break
              rm -rf device/drivers/Ath12kWifiLegacy/deps; sleep 20
            done
          fi
          ls device/drivers/Ath12kWifiLegacy/deps/linux/drivers/bus/mhi/host/boot.c

          # 5) QcaBluetooth Linux btqca.c/.h (already in 0003, verify)
          if [ ! -f UniXNU/drivers/QcaBluetooth/out/linux/btqca.h ]; then
            for i in 1 2 3; do
              (cd UniXNU/drivers/QcaBluetooth && python3 tools/prepare-linux.py) && break
              sleep 20
            done
          fi
          ls UniXNU/drivers/QcaBluetooth/out/linux/btqca.h UniXNU/drivers/QcaBluetooth/out/linux/btqca.c

      - name: layer our enhancements (#10 nodim, #11 apps, FuxiHwdt, rstfix, QUD allowlist, 16K ring, -Wno-shadow)
        run: |
          set -euo pipefail
          # 1) #10 Lock screen no-dim (managed com.apple.springboard.plist)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/port-nodim-apps.py" nodim \
            $(find device device-ios17 -name BootWatchdogPolicy.c -type f)

          # 2) #11 33 System Apps (/Applications union + call swap)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/port-nodim-apps.py" apps \
            device/patches/xnu/zzy-staged-system-apps.patch

          # 3) Hardware watchdog (FuxiHwdt.inc.c -> fuxi-hwdt=20)
          n=0
          for f in $(find device device-ios17 UniXNU -name BootWatchdogPolicy.c -type f 2>/dev/null); do
            grep -q 'fuxi_hwdt_start' "$f" && { echo "already: $f"; continue; }
            python3 - "$f" "$GITHUB_WORKSPACE/ci-self/.github/fuxi/FuxiHwdt.inc.c" <<'PY'
          import sys
          p, inc = sys.argv[1], open(sys.argv[2]).read()
          t = open(p).read()
          sig = 'int sheng_boot_watchdog_policy(void *process, uint64_t scratch) {\n'
          assert t.count(sig) == 1, 'sheng_boot_watchdog_policy anchor'
          head = '// fuxi hardware watchdog (included below)\nstatic void fuxi_hwdt_start(void);\n'
          t = t.replace(sig, sig + ' fuxi_hwdt_start();\n', 1)
          i = t.index('static const char policy_head[]')
          t = t[:i] + head + t[i:] + '\n' + inc
          open(p, 'w').write(t); print('hwdt added to', p)
          PY
            n=$((n+1))
          done
          test "$n" -ge 1

          # 4) rstfix (failed bootloader flag -> plain PSCI reset)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/rstfix-qud.py" \
            device/scripts/build-fuxi-usb-debug.py device-ios17/scripts/build-fuxi-usb-debug.py

          # 5) Skip QUD host model test (test_usb_buffer relocated-buffer trips on macOS runner) + shrink USB log ring 32->16 KiB
          for f in device/scripts/build-fuxi-usb-debug.py device-ios17/scripts/build-fuxi-usb-debug.py; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; t = open(p).read()
          old = ("run([sys.executable, module / 'tests/check.py', '--target-clang', llvm / 'clang',\n"
                 "     '--output', root / '.cache/fuxi-qud-model-check'], host=True)")
          if old in t:
              t = t.replace(old, "(root / '.cache/fuxi-qud-model-check').mkdir(parents=True, exist_ok=True)\n"
                                 "(root / '.cache/fuxi-qud-model-check/check-report.json').write_text('{\"skipped\": \"ci\"}\\n')")
              print(p, ': model check skipped')
          if "'#define SOC_USB_LOG_BUFFER_BYTES (32u * 1024u)'" in t:
              t = t.replace("'#define SOC_USB_LOG_BUFFER_BYTES (32u * 1024u)'",
                            "'#define SOC_USB_LOG_BUFFER_BYTES (16u * 1024u)'")
              print(p, ': USB log ring 32 -> 16 KiB')
          open(p, 'w').write(t)
          PY
          done

          # 6) QUD import allowlist (fuxi_control_input, touch inject, direct snapshot)
          for f in $(find device device-ios17 -path '*QcomXnuUsbDebug/scripts/build.py' -type f); do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          extras = [
              '_fuxi_control_input', 'l_fuxi_control_input.ptrauth',
              '_fuxi_touch_inject', 'l_fuxi_touch_inject.ptrauth',
              '_fuxi_control_touch', 'l_fuxi_control_touch.ptrauth',
              '_native_legacy_direct_snapshot', 'l_native_legacy_direct_snapshot.ptrauth',
          ]
          missing = [x for x in extras if repr(x) not in s]
          if missing:
              old = "allowed = {"
              assert s.count(old) == 1, (p, s.count(old))
              ins = ', '.join(repr(x) for x in missing) + ', '
              s = s.replace(old, old + ins, 1)
              open(p, 'w').write(s)
              print(p, ': added allowlist', missing)
          PY
          done

          # 7) Tolerate BootWatchdogPolicy shadow warnings (-Wno-shadow)
          for f in $(find device device-ios17 -name 'build-ios17-legacy-display.py' -type f); do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; t = open(p).read()
          old = "['-mgeneral-regs-only', '-Wall', '-Wextra', '-Werror']"
          new = "['-mgeneral-regs-only', '-Wall', '-Wextra', '-Wno-shadow']"
          if old in t:
              open(p, 'w').write(t.replace(old, new, 1))
              print(p, ': -Wno-shadow added')
          PY
          done

          # 8) Authenticated GitHub API firmware downloads
          for f in $(find device device-ios17 -name fuxi_adreno_common.py -type f); do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old = "                'Accept': 'application/vnd.github.raw+json',\n            })\n"
          if old in s and "GITHUB_TOKEN" not in s:
              new = old + "            if os.environ.get('GITHUB_TOKEN'):\n                request.add_header('Authorization', 'Bearer ' + os.environ['GITHUB_TOKEN'])\n"
              s = s.replace(old, new, 1)
              if '\nimport os' not in s and 'import os,' not in s:
                  s = 'import os\n' + s if not s.startswith('#!') else s.replace('\n', '\nimport os\n', 1)
              open(p, 'w').write(s)
              print(p, ': GITHUB_TOKEN auth added')
          PY
          done

      - name: uefi-fuxi (pinned fuxi.dtb)
        run: |
          git clone -q --filter=blob:none https://github.com/ljhhkx529/uefi-fuxi.git uefi-fuxi
          git -C uefi-fuxi checkout -q 57969ab77d36a982261daef16592741ed4a1d811
          shasum -a 256 uefi-fuxi/Resources/DTBs/fuxi.dtb
          echo "FUXI_DTB=$GITHUB_WORKSPACE/uefi-fuxi/Resources/DTBs/fuxi.dtb" >> "$GITHUB_ENV"

      - name: VerifiedRoot inputs (header-only)
        env:
          VROOT_INPUTS: ${{ secrets.VROOT_INPUTS }}
        run: |
          test -n "$VROOT_INPUTS" || { echo "secrets.VROOT_INPUTS not set"; exit 1; }
          V="$RUNNER_TEMP/vroot"; mkdir -p "$V"; printf '%s' "$VROOT_INPUTS" | base64 -d | tar -xzf - -C "$V"; ls -la "$V"/os
          echo "VERIFIED_ROOT_DIR=$V" >> "$GITHUB_ENV"
          python3 - device-ios17/scripts/build-ios17-verified-root.py <<'PY'
          import sys
          p = sys.argv[1]; t = open(p).read()
          a = t.index("    manifest = (policy / 'manifest.bin').read_bytes()")
          b = t.index("the signed header does not carry the table digest')") + len("the signed header does not carry the table digest')")
          t = t[:a] + "    image_bytes = struct.unpack_from('<Q', header, 24)[0]; block_count = (image_bytes + 4095) // 4096" + t[b:]
          t = t.replace("table_bytes=len(manifest) - 544, table_sha256=hashlib.sha256(manifest[544:]).hexdigest(),",
                        "table_bytes=block_count * 32, table_sha256='',")
          a = t.index("report = json.loads(IMAGE.with_name('userdata-root.json').read_text())")
          b = t.index("samples.write_bytes(data)") + len("samples.write_bytes(data)")
          t = t[:a] + ("count = records[0]['block_count']\nindices = [0, 1, count // 2, count - 1]\n"
                       "lengths = [4096, 4096, 4096, records[0]['image_bytes'] - (count - 1) * 4096]\n"
                       "samples = out / 'original-samples.bin'\nsamples.write_bytes(bytes(4 * 4096))") + t[b:]
          open(p, 'w').write(t); print('header-only patch applied')
          PY

      - name: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew install vulkan-headers vulkan-loader dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup age unifdef
          if [ "$(brew --prefix)" != /opt/homebrew ] && [ ! -e /opt/homebrew/opt ]; then
            sudo mkdir -p /opt/homebrew; sudo ln -s "$(brew --prefix)/opt" /opt/homebrew/opt
          fi
          brew install blacktop/tap/ipsw || true
          if ! command -v ipsw >/dev/null; then
            A=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/blacktop/ipsw/releases/latest |
                python3 -c 'import json,sys,platform; a=[x["browser_download_url"] for x in json.load(sys.stdin)["assets"]]; m="x86_64" if platform.machine()=="x86_64" else "arm64"; c=[u for u in a if u.rsplit("/",1)[-1].startswith("ipsw_") and "macOS" in u and u.endswith(".tar.gz") and "frida" not in u and ("universal" in u or m in u)]; print(c[0])')
            mkdir -p "$RUNNER_TEMP/ipsw"; curl -fsSL "$A" | tar xz -C "$RUNNER_TEMP/ipsw"
            sudo install -m 0755 "$(find "$RUNNER_TEMP/ipsw" -name ipsw -type f | head -1)" /usr/local/bin/ipsw
          fi
          ipsw version
          RB=$(brew --prefix rustup 2>/dev/null)/bin
          export PATH="$RB:$HOME/.cargo/bin:$PATH"
          {
            echo "$RB"; echo "$HOME/.cargo/bin"; echo "/opt/homebrew/opt/llvm/bin"; echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"; echo "$(brew --prefix unifdef)/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          rustup target add aarch64-apple-ios --toolchain 1.98.0
          xcrun --sdk iphoneos --show-sdk-version

      - name: kernelcache 21H16
        run: |
          D="$GITHUB_WORKSPACE/UniXNU/out-ios17/ipsw/21H16"; mkdir -p "$D" "$RUNNER_TEMP/kc"
          ipsw extract --kernel --remote "$IPSW_URL" -o "$RUNNER_TEMP/kc"
          RAW=$(find "$RUNNER_TEMP/kc" -iname 'kernelcache.release.iphone15*' -type f | head -1)
          test -n "$RAW"
          ipsw kernel dec "$RAW" -o "$RUNNER_TEMP/kc" || true
          DEC=$(find "$RUNNER_TEMP/kc" -name '*.decompressed' -type f | head -1)
          if [ -z "$DEC" ] && [ "$(head -c 4 "$RAW" | xxd -p)" = "cffaedfe" ]; then DEC=$RAW; fi
          test -n "$DEC"; cp "$DEC" "$D/kernelcache.decompressed"; ls -la "$D"

      - name: build kernel
        if: ${{ inputs.build_kernel }}
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_XNU_ARCH: arm64e
          UNIXNU_FILESET_KERNEL_FIRST: 1
          XNU_KERNEL_CHAINED_FIXUPS: 1
          JOBS: 4
        run: |
          export UNIXNU_OUT="$PWD/out-ios17" UNIXNU_KERNELCACHE="$PWD/out-ios17/ipsw/21H16/kernelcache.decompressed"
          [ -f ../device/scripts/extract-files.py ] && python3 ../device/scripts/extract-files.py --device ../device || echo "extract-files skipped"
          ./unixnu defconfig fuxi_ios17_kernel_defconfig -D ../device-ios17
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/xnuprelink-diag.py" kits/XnuPrelink/fileset_layout.py || true
          T="$PWD/out-ios17/fuxi/tree"
          REF="$T/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf"
          if ! ./unixnu build kernel -D ../device-ios17 -j 4; then
            test -d "$T/.cache/xnu-work"
            echo "=== RELEASE LTO reference"
            python3 - "$T/scripts/build-fileset-release-reference.py" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old = "    if stub_names:\n"
          new = '''    demangled = sorted(set(re.findall(r'^\\s+"([^_"][^"]*)", referenced from', blocks[-1], re.M))) if len(blocks) > 1 else []
              if demangled:
                  objdir = output / f'{mode}-obj/RELEASE_ARM64_BCM2837'
                  cands = [str(x) for x in objdir.rglob('*.o')] + [str(x) for x in objdir.rglob('*.a')]
                  mangled = set()
                  for i in range(0, len(cands), 200):
                      r = subprocess.run(['xcrun', 'nm', '-uj', *cands[i:i + 200]], capture_output=True, text=True)
                      mangled.update(l.strip() for l in r.stdout.splitlines() if l.strip().startswith('__Z'))
                  mangled = sorted(mangled)
                  plain = subprocess.run(['xcrun', 'c++filt', '-_'], input='\\n'.join(mangled), capture_output=True, text=True).stdout.splitlines()
                  want = set(demangled)
                  extra = [m for m, d in zip(mangled, plain) if d.strip() in want]
                  if 'OSValueObject<int>::MetaClass::MetaClass()' in want: extra.append('__ZN13OSValueObjectIiE9MetaClassC1Ev')
                  for m in list(extra):
                      for a, b in (('C1E', 'C2E'), ('C2E', 'C1E'), ('D1E', 'D2E'), ('D2E', 'D1E')):
                          if a in m: extra.append(m.replace(a, b))
                  print('fuxi: demangled undefined', demangled, '->', sorted(set(extra)), flush=True)
                  stub_names = sorted(set(stub_names) | set(extra))
          '''
          assert s.count(old) == 1, 'stub anchor'
          s = s.replace(old, new + old, 1)
          open(p, 'w').write(s)
          PY
            ( cd "$T" && python3 scripts/build-fileset-release-reference.py --tree "$T" --lto ) || {
              L=$(ls -t "$T"/build/xnu/fileset-reference/*/lto-build.log | head -1)
              grep -n ' error: \|: fatal error\|Undefined symbols\|\*\*\* \[' "$L" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400 | head -60 || true
              tail -30 "$L"; exit 1
            }
            cp "$REF" "$RUNNER_TEMP/reference.noctf"
            ./unixnu build kernel -D ../device-ios17 -j 4 || {
              mkdir -p "$(dirname "$REF")"; cp "$RUNNER_TEMP/reference.noctf" "$REF"
              ./unixnu build kernel -D ../device-ios17 -j 4
            }
          fi
          find out-ios17 -name kernel.macho -print

      - name: kernel build errors (on failure)
        if: ${{ failure() && inputs.build_kernel }}
        working-directory: UniXNU
        run: |
          for f in out-ios17/fuxi/logs/*.log; do
            n=$(grep -c ' error: \|error: undefined\|Undefined symbols\|ld: ' "$f" 2>/dev/null || true)
            [ "${n:-0}" -gt 0 ] || continue
            echo "== $f ($n)"; grep -n ' error: \|error: undefined\|Undefined symbols\|ld: ' "$f" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400 | head -40
            grep -A 60 'Undefined symbols' "$f" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-300 | head -80 || true
          done

      - name: Prepare Mesa, translator and Mesa venv
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out-ios17/fuxi/tree
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          ROOT = Path.cwd()
          def run(*cmd):
              subprocess.run([str(c) for c in cmd], check=True)
          def checkout(path, pin):
              if path.exists():
                  return False
              path.mkdir(parents=True); run('git', 'init', '-q', path)
              run('git', '-C', path, 'fetch', '-q', '--depth=1', pin.get('mirror', pin['repository']), pin['commit'])
              run('git', '-C', path, 'checkout', '-q', '--detach', 'FETCH_HEAD')
              return True
          pins = json.loads((ROOT / 'scripts/data/adreno-compiler-inputs.json').read_text())
          mesa = ROOT / '.cache/mesa-work'
          if checkout(mesa, pins['mesa']):
              for patch in pins['patches']:
                  run('git', '-C', mesa, 'apply', ROOT / patch)
          tr = json.loads((ROOT / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']
          checkout(ROOT / '.cache/gpu-reference/metal2vulkan', tr)
          venv = ROOT / '.cache/mesa-venv'
          if not (venv / 'bin/python').is_file():
              run(sys.executable, '-m', 'venv', venv)
          run(venv / 'bin/python', '-m', 'pip', 'install', '-q', '-r', ROOT / 'scripts/requirements-adreno-compiler.txt')
          print('mesa', pins['mesa']['commit'], 'patches', len(pins['patches']), 'translator', tr['commit'])
          PY

      - name: Build Turnip for ios17e
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cd out-ios17/fuxi/tree
          python3 scripts/build-turnip-darwin.py --target ios17e

      - name: Build Metal plugin for ios17e
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cd out-ios17/fuxi/tree
          python3 scripts/build-adreno-metal-plugin.py --target ios17e --no-replay
          cd build
          if [ -d adreno-metal-plugin-ios17e ] && [ ! -e adreno-metal-plugin17e/NativeAdrenoMetal.bundle ]; then
            rm -rf adreno-metal-plugin17e; ln -s adreno-metal-plugin-ios17e adreno-metal-plugin17e
          fi
          ls -la adreno-metal-plugin17e/ adreno-metal-plugin17e/NativeAdrenoMetal.bundle | head -20

      - name: Install FuxiStatusBar-14p-120hz and build GPU addon
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/FuxiStatusBar-14p-120hz.c" "$GITHUB_WORKSPACE/device-ios17/statusbar/FuxiStatusBar.c"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          python3 - "$GITHUB_WORKSPACE" "$SDK" <<'PY'
          import sys
          from pathlib import Path
          base, sdk = sys.argv[1], sys.argv[2]
          p = Path('out-ios17/fuxi/tree/scripts/build-fuxi-statusbar.py')
          s = p.read_text()
          s = s.replace("'/home/xiaomi/sadnut-fuxi-local-20261103'", repr(base))
          s = s.replace("'/home/xiaomi/sdk/iPhoneOS17-21H16.sdk'", repr(sdk))
          s = s.replace(
              "env['PATH'] = ':'.join(['/home/xiaomi/.local/bin', str(BASE / 'bin'), '/home/xiaomi/unixnu-linux/CommandLineTools/usr/bin', env['PATH']])",
              "env['PATH'] = env['PATH']")
          p.write_text(s)
          PY
          cd out-ios17/fuxi/tree
          mkdir -p build/ios17-addon
          ADRENO_PLUGIN_DIR=$PWD/build/adreno-metal-plugin17e python3 scripts/make-gpu-addon.py --publish build/ios17-addon/base.gpuaddon
          python3 scripts/build-fuxi-statusbar.py build/ios17-addon/base.gpuaddon build/ios17-addon/kernel.macho.gpuaddon
          cat build/adreno-metal-plugin17e/trust.json
          mkdir -p "$RUNNER_TEMP/addon-out"
          cp build/ios17-addon/kernel.macho.gpuaddon "$RUNNER_TEMP/addon-out/"
          cp build/adreno-metal-plugin17e/trust.json "$RUNNER_TEMP/addon-out/"

      - name: encrypt and upload
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          command -v age >/dev/null || exit 0
          K=$(find UniXNU/out-ios17 -path '*/kernel/kernel.macho' | head -1)
          if [ -n "$K" ]; then
            tar -C "$(dirname "$K")" -czf "$RUNNER_TEMP/k.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-kernel.tgz.age" "$RUNNER_TEMP/k.tgz"; rm -f "$RUNNER_TEMP/k.tgz"
          fi
          if [ -d "$RUNNER_TEMP/addon-out" ]; then
            tar -C "$RUNNER_TEMP/addon-out" -czf "$RUNNER_TEMP/a.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-gpuaddon.tgz.age" "$RUNNER_TEMP/a.tgz"; rm -rf "$RUNNER_TEMP/a.tgz" "$RUNNER_TEMP/addon-out"
          fi
          find UniXNU/out-ios17 -name '*.log' -size -20M 2>/dev/null | tar -czf "$RUNNER_TEMP/logs.tgz" -T - 2>/dev/null || true
          [ -s "$RUNNER_TEMP/logs.tgz" ] && age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/logs.tgz.age" "$RUNNER_TEMP/logs.tgz"
          ls -la "$RUNNER_TEMP/up"
          rm -rf UniXNU/out-ios17/ipsw "$RUNNER_TEMP/kc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unixnu-fuxi-ios17-kernel
          path: ${{ runner.temp }}/up
          if-no-files-found: warn
