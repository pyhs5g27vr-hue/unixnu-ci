      - name: Build Metal plugin for ios17e
        if: ${{ success() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cd out-ios17/fuxi/tree
          # Minimal GpuScanoutPresenter.h optimization: kSources 4->6 (match kernel 6 mappings)
          python3 - <<'PGSP'
          from pathlib import Path
          gp = Path('drivers/AdrenoMetal/GpuScanoutPresenter.h')
          s = gp.read_text()
          s1 = 'static constexpr unsigned kSources = 4;'
          assert s.count(s1) == 1, f'kSources anchor count={s.count(s1)}'
          s = s.replace(s1, 'static constexpr unsigned kSources = 6;', 1)
          gp.write_text(s)
          print('GpuScanoutPresenter.h: kSources=6 patched')
          PGSP
          # Guard iPadOS 27 (24A446) hardcoded QuartzCore shared-cache writes on ios17e (21H16)
          python3 - <<'P24A'
          from pathlib import Path
          p = Path('drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm'); s = p.read_text()
          old = '#if !TARGET_OS_OSX\n        // The stored option values and the framebuffer branch are addresses of iPadOS 27\'s QuartzCore (24A446).'
          new = '#if !TARGET_OS_OSX && !defined(NATIVE_ADRENO_IOS17_ARM64E)\n        // The stored option values and the framebuffer branch are addresses of iPadOS 27\'s QuartzCore (24A446).'
          assert s.count(old) == 1, f'24A446 QuartzCore guard count={s.count(old)}'
          p.write_text(s.replace(old, new, 1))
          print('NativeAdrenoMetalPlugin.mm: guarded 24A446 QuartzCore writes for ios17e')
          P24A
          # row=1: 只开 telemetry 表（内核 board rows，串口可读），不开 diag=1 的帧 trace / Turnip stamp /
          # encoder timing —— 那些内存会把 backboardd 顶到 Jetsam 打死（实测 signal 9 / ns 25，present 0）。
          python3 - <<'PROW'
          from pathlib import Path
          p = Path('drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm'); s = p.read_text()
          a1 = '            setenv("METAL2VULKAN_ENCODER_TIMES", "8ms", 1);\n            setenv("METAL2VULKAN_QUEUE_TIMES", "1", 1);\n        }\n'
          assert s.count(a1) == 1, 'diag flags anchor'
          add = ('        // row=1: the telemetry table alone (the kernel board rows, readable over serial), without diag=1 frame\n'
                 '        // trace, Turnip stamps and encoder timing, whose memory ends backboardd in seconds.\n'
                 '        if (bootArgSet("row=1")) setenv("SHENG_STATUS", "1", 1);\n'
                 '        else unsetenv("SHENG_STATUS");\n')
          s = s.replace(a1, a1 + add, 1)
          a2 = '        if (getenv("SHENG_DIAG")) {\n            pthread_t telemetry;'
          assert s.count(a2) == 1, 'telemetry start anchor'
          s = s.replace(a2, '        if (getenv("SHENG_DIAG") || getenv("SHENG_STATUS")) {\n            pthread_t telemetry;', 1)
          p.write_text(s)
          print('row=1 (SHENG_STATUS) patched into the plugin')
          PROW
          # Guard iOS 17 SDK shim enums if present in Xcode 26's iPhoneOS26.5.sdk MTLLibrary.h
          python3 - <<'PYENUM'
          from pathlib import Path
          p = Path('drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm')
          s = p.read_text()
          n = 0
          for line in (
              'enum {MTLMathModeSafe = 0, MTLMathModeRelaxed = 1, MTLMathModeFast = 2};',
              'enum {MTLMathFloatingPointFunctionsFast = 0, MTLMathFloatingPointFunctionsPrecise = 1};',
          ):
              if line in s:
                  s = s.replace(line, '// ' + line + ' /* in iPhoneOS26 SDK */')
                  n += 1
          # iPhoneOS26.5 SDK: MTLBarrierScopeRenderTargets is API_UNAVAILABLE(ios); same value (1 << 2) by number
          old = 'MTLBarrierScopeBuffers|MTLBarrierScopeTextures|MTLBarrierScopeRenderTargets'
          assert s.count(old) == 1, ('barrier scope anchor', s.count(old))
          s = s.replace(old, 'MTLBarrierScopeBuffers|MTLBarrierScopeTextures|(MTLBarrierScope)(1 << 2)')
          assert 'MTLBarrierScopeRenderTargets' not in s, 'MTLBarrierScopeRenderTargets still used'
          p.write_text(s)
          print('guarded SDK26 enum shims:', n, '+ barrier scope render targets by value')
          PYENUM
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/mu2-diag.py" frontend drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm
          # route A (Gemini 11-26 15:41): a pipeline refused for 550/551 (b3a8) color attachments is retried as 115 (RGBA16Float)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-xr550-fallback.py" drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm
          # Gemini 11-26 20:34: row=1 sends key [metal table] rows to COM3; refuseSurface() notes its first 3 refusals
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-metal-table-note.py" drivers/AdrenoMetal/NativeMetalBridgePhase.h drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm
          # Claude+Gemini 11-27: linear alignment >= 512 B (1179/1170 swap surfaces: stride 4864 rendered black, 5120 lights)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/align512.py" drivers/AdrenoMetal
          # Claude+Gemini 11-28: fuxi-metal-early=N turns on the early completed handlers (upstream off) with an in-flight cap; absent = off
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-metal-early.py" drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm
          # Claude+Gemini 11-28: serveScanout (scanout_scale copy) thread at USER_INTERACTIVE; fuxi-scanout-qos=0 = old
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-scanout-qos.py" drivers/AdrenoMetal/NativeAdrenoMetalPlugin.mm
          python3 scripts/build-adreno-metal-plugin.py --target ios17e --no-replay
          cd build
          if [ -d adreno-metal-plugin-ios17e ] && [ ! -e adreno-metal-plugin17e/NativeAdrenoMetal.bundle ]; then
            rm -rf adreno-metal-plugin17e; ln -s adreno-metal-plugin-ios17e adreno-metal-plugin17e
          fi
          ls -la adreno-metal-plugin17e/ adreno-metal-plugin17e/NativeAdrenoMetal.bundle | head -20

      - name: Install FuxiStatusBar-14p-120hz and build GPU addon
        if: ${{ success() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/FuxiStatusBar-14p-120hz.c" "$GITHUB_WORKSPACE/device-ios17/statusbar/FuxiStatusBar.c"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          python3 - "$GITHUB_WORKSPACE" "$SDK" <<'PY'
          import sys
          from pathlib import Path
          base, sdk = sys.argv[1], sys.argv[2]
          p = Path('out-ios17/fuxi/tree/scripts/build-fuxi-statusbar.py')
          s = p.read_text()
          s = s.replace("'/home/xiaomi/sadnut-fuxi-local-20261103'", repr(base))
          s = s.replace("'/home/xiaomi/sdk/iPhoneOS17-21H16.sdk'", repr(sdk))
          s = s.replace(
              "env['PATH'] = ':'.join(['/home/xiaomi/.local/bin', str(BASE / 'bin'), '/home/xiaomi/unixnu-linux/CommandLineTools/usr/bin', env['PATH']])",
              "env['PATH'] = env['PATH']")
          p.write_text(s)
          PY
          cd out-ios17/fuxi/tree
          mkdir -p build/ios17-addon
          ADRENO_PLUGIN_DIR=$PWD/build/adreno-metal-plugin17e python3 scripts/make-gpu-addon.py --publish build/ios17-addon/base.gpuaddon
          python3 scripts/build-fuxi-statusbar.py build/ios17-addon/base.gpuaddon build/ios17-addon/kernel.macho.gpuaddon
          cat build/adreno-metal-plugin17e/trust.json
          mkdir -p "$RUNNER_TEMP/addon-out"
          cp build/ios17-addon/kernel.macho.gpuaddon "$RUNNER_TEMP/addon-out/"
          cp build/adreno-metal-plugin17e/trust.json "$RUNNER_TEMP/addon-out/"

      - name: encrypt and upload
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          command -v age >/dev/null || exit 0
          K=$(find UniXNU/out-ios17 -path '*/kernel/kernel.macho' | head -1)
          if [ -n "$K" ]; then
            tar -C "$(dirname "$K")" -czf "$RUNNER_TEMP/k.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-kernel.tgz.age" "$RUNNER_TEMP/k.tgz"; rm -f "$RUNNER_TEMP/k.tgz"
          fi
          if [ -d "$RUNNER_TEMP/addon-out" ]; then
            tar -C "$RUNNER_TEMP/addon-out" -czf "$RUNNER_TEMP/a.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-gpuaddon.tgz.age" "$RUNNER_TEMP/a.tgz"; rm -rf "$RUNNER_TEMP/a.tgz" "$RUNNER_TEMP/addon-out"
          fi
          # 符号化材料：插件的 linker map 与 dSYM 都留在了构建目录里，一起带出来（P0 SIGBUS 定位需要）
          mkdir -p "$RUNNER_TEMP/sym"
          find UniXNU/out-ios17 -name 'NativeAdrenoMetal.map' -exec cp {} "$RUNNER_TEMP/sym/" \; 2>/dev/null || true
          for d in $(find UniXNU/out-ios17 -maxdepth 7 -name 'NativeAdrenoMetal.dSYM' 2>/dev/null); do cp -R "$d" "$RUNNER_TEMP/sym/" || true; done
          B=$(find UniXNU/out-ios17 -name 'NativeAdrenoMetal' -type f -size +1M 2>/dev/null | head -1)
          if [ -n "$B" ]; then
            cp "$B" "$RUNNER_TEMP/sym/NativeAdrenoMetal.stripped" || true
            llvm-nm -n "$B" > "$RUNNER_TEMP/sym/nm.txt" 2>&1 || true
            llvm-objdump --macho --private-headers "$B" > "$RUNNER_TEMP/sym/headers.txt" 2>&1 || true
          fi
          ls -la "$RUNNER_TEMP/sym" || true
          if [ -n "$(ls -A "$RUNNER_TEMP/sym" 2>/dev/null)" ]; then
            tar -C "$RUNNER_TEMP/sym" -czf "$RUNNER_TEMP/sym.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/symbols.tgz.age" "$RUNNER_TEMP/sym.tgz"
          fi

          find UniXNU/out-ios17 -name '*.log' -size -20M 2>/dev/null | tar -czf "$RUNNER_TEMP/logs.tgz" -T - 2>/dev/null || true
          [ -s "$RUNNER_TEMP/logs.tgz" ] && age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/logs.tgz.age" "$RUNNER_TEMP/logs.tgz"
          ls -la "$RUNNER_TEMP/up"
          rm -rf UniXNU/out-ios17/ipsw "$RUNNER_TEMP/kc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unixnu-fuxi-ios17-kernel
          path: ${{ runner.temp }}/up
          if-no-files-found: warn
