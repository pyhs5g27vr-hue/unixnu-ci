name: fuxi iOS 17 Grand-Slam (Kerfand f0ae963 + all local enhancements)

# Reconstructs Kerfand's latest snapshot via tools/reconstruct.sh (Safari, keyboard 3-piece,
# Adreno740 1c9029b + AdrenoMetal c9ebd2fb + scanout_scale, Wi-Fi DMA cache, PPS/PD fast charge,
# Audio/buttons, 8-core support, RTC/timezone, DPU direct + GPU handoff, zz-protection-class-none)
# and layers our verified local additions: FuxiHwdt (fuxi-hwdt=20), #10 nodim, #11 apps union,
# QUD reboot/rstfix, 16 KiB USB log ring, and smart FuxiStatusBar-14p-120hz.c.

on:
  workflow_dispatch:
    inputs:
      kerfand_ref:
        description: Kerfand/UniXNU-Fuxi-Arm64e-iOS17 ref (with tools/reconstruct.sh)
        required: true
        default: f0ae963b674c53a9c1fa5836bfcf89d38bbf77c9
      build_kernel:
        description: Build the kernel
        type: boolean
        default: true
      build_addon:
        description: Build kernel.macho.gpuaddon (Turnip, Metal plugin, FuxiStatusBar-14p-120hz, trust)
        type: boolean
        default: true
      runner:
        description: macOS runner label
        required: true
        default: macos-26

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  AGE_RECIPIENT: age10kh2jlkf7c3hcnuylu9l7gmzly9z6d983ez2epawumlu7fz4myrqj6de0n
  IPSW_URL: https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-79094/90CE304F-6C16-402E-96C9-89260D93CA82/iPhone15,2_17.7_21H16_Restore.ipsw

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ ! -d "$DEVELOPER_DIR" ]; then
            X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"; echo "using $X"
          fi

      - uses: actions/checkout@v4
        with:
          path: ci-self
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Kerfand/UniXNU-Fuxi-Arm64e-iOS17
          ref: ${{ inputs.kerfand_ref }}
          path: kerfand
          persist-credentials: false

      - name: reconstruct full Kerfand tree (tools/reconstruct.sh)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Authenticate GitHub clones via extraHeader (NOT url.insteadOf! insteadOf rewrites origin URLs
          # to https://x-access-token:...@github.com/... which breaks UniXNU components.py official_alias()
          # and drops legacy_name symlinks like SoftwareAES -> NativeAES).
          B64=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git config --global "http.https://github.com/.extraHeader" "AUTHORIZATION: basic $B64"
          bash kerfand/tools/reconstruct.sh "$GITHUB_WORKSPACE"
          # metalup2: upgrade Adreno740 -> 2962e289 (+ fuxi port patch) and AdrenoMetal -> b25e48e5 (UniXNU b04f131 pins)
          git -C UniXNU/drivers/Adreno740 fetch -q origin 2962e289c9690aeb668072c170679e6fb28bf8de
          git -C UniXNU/drivers/Adreno740 checkout -q 2962e289c9690aeb668072c170679e6fb28bf8de
          git -C UniXNU/drivers/Adreno740 apply --index "$GITHUB_WORKSPACE/ci-self/.github/fuxi/a740-fuxi-on-2962e289.patch"
          git -C UniXNU/drivers/Adreno740 -c user.name=ci -c user.email=ci@localhost commit -q -m "fuxi: port 0001+0002 onto 2962e289"
          git -C UniXNU/drivers/AdrenoMetal fetch -q origin b25e48e51dfdf4b3889ede6e701ab7dd59929a03
          git -C UniXNU/drivers/AdrenoMetal checkout -q b25e48e51dfdf4b3889ede6e701ab7dd59929a03
          # Kerfand 82e scanout_scale (GPU scaling of the logical 1179x2556 frame to the 1080x2400 panel); without it every GPU frame is refused
          git -C UniXNU/drivers/AdrenoMetal apply --index "$GITHUB_WORKSPACE/ci-self/.github/fuxi/adrenometal-82e-scanout-scale.diff"
          # no FUXI_SCANOUT_AIR build step here: scale() takes scanout_scale from nmb_scanout_convert_air (the patched .ll) instead
          sed -i '' 's|^extern "C" const void \*fuxi_scanout_scale_air(size_t \*length) __attribute__((weak_import));$|static const void *(*const fuxi_scanout_scale_air)(size_t *) = nullptr;|' UniXNU/drivers/AdrenoMetal/GpuScanoutPresenter.h
          grep -n "fuxi_scanout_scale_air)(size_t" UniXNU/drivers/AdrenoMetal/GpuScanoutPresenter.h
          git -C UniXNU/drivers/AdrenoMetal add GpuScanoutPresenter.h
          git -C UniXNU/drivers/AdrenoMetal -c user.name=ci -c user.email=ci@localhost commit -q -m "fuxi: Kerfand 82e scanout_scale"
          # upstream 6245fea pacing (WindowServer-like thread policy + setBytes batching), Gemini cut onto b25e48e (claude 11-27)
          git -C UniXNU/drivers/AdrenoMetal apply --index "$GITHUB_WORKSPACE/ci-self/.github/fuxi/adrenometal-pacing-6245fea.patch"
          git -C UniXNU/drivers/AdrenoMetal -c user.name=ci -c user.email=ci@localhost commit -q -m "fuxi: upstream 6245fea pacing"
          # upstream AdrenoMetal #74 85832c3a: IOSurface row alignment answers 16 (SF Symbol glyphs), Gemini cut onto b25e48e (claude 11-28)
          git -C UniXNU/drivers/AdrenoMetal apply --index "$GITHUB_WORKSPACE/ci-self/.github/fuxi/adrenometal-pr74-iosurface-align16.patch"
          git -C UniXNU/drivers/AdrenoMetal -c user.name=ci -c user.email=ci@localhost commit -q -m "fuxi: upstream #74 iosurface align 16"
          git -C UniXNU log --oneline -5
          git -C UniXNU/drivers/Adreno740 log --oneline -3
          git -C UniXNU/drivers/AdrenoMetal log --oneline -3
          git -C UniXNU/drivers/GopFramebuffer log --oneline -3
          git -C UniXNU/drivers/ArmCpu log --oneline -2
          ls -la UniXNU/drivers/SoftwareAES/OriginalAESABI.h
          # Record the reconstructed local submodule commits in UniXNU so `./unixnu build`
          # does not try to fetch Kerfand's old unpushed submodule SHAs from origin.
          for sm in drivers/Adreno740 drivers/AdrenoMetal drivers/AppleKeyStoreState drivers/ArmCpu drivers/GopFramebuffer kits/XnuPrelink; do
            [ -d "UniXNU/$sm" ] && git -C UniXNU add "$sm"
          done
          git -C UniXNU -c user.name=ci -c user.email=ci@localhost commit -q -m "fuxi: record reconstructed submodule pins" || true
          # User preference: never draw colored boot-stage squares or blue/white beat block on screen.
          python3 - UniXNU/patches/xnu-10063-arm64e/screen-quiet-after-swap.patch <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          old = '+\treturn &native_legacy_swapstat[0] != NULL && native_legacy_swapstat[0] != 0;\n'
          new = '+\t(void)native_legacy_swapstat; return true;\n'
          assert old in s, 'screen-quiet anchor'
          open(p, 'w').write(s.replace(old, new, 1))
          print('screen-quiet-after-swap: colored boot squares disabled completely')
          PY
          # Port upstream rk3588-wc-batch-flush.patch: flush+invalidate dirty zero lines on batch VM_WIMG_WCOMB transitions
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-wc-batch-flush.patch" UniXNU/patches/xnu-10063-arm64e/zzz-wc-batch-flush.patch
          # fuxi: two compressor pools on iOS (2 GiB+ devices get one), so the wallpaper and
          # widget processes stay resident on a 6.5 GiB window instead of being jetsammed.
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/zzz-compressor-pool-2.patch" \
             UniXNU/patches/xnu-10063-arm64e/zzz-compressor-pool-2.patch
          # Ensure zz-msg-probe.patch and zzz-webkit-msg-probe.patch declare proc_pid for RELEASE LTO reference
          for mp in UniXNU/patches/xnu-10063-arm64e/zz-msg-probe.patch UniXNU/patches/xnu-10063-arm64e/zzz-webkit-msg-probe.patch; do
            [ -f "$mp" ] && python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/zz-msg-probe-fix.py" "$mp"
          done
          # Reconstructed drivers/Adreno740 has identical content to f4a9fbb3... with a fresh local commit hash;
          # update prepare-fuxi-driver-compat.py to recognize the reconstructed HEAD.
          A740_REV=$(git -C UniXNU/drivers/Adreno740 rev-parse HEAD)
          for f in device/scripts/prepare-fuxi-driver-compat.py device-ios17/scripts/prepare-fuxi-driver-compat.py; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            python3 - "$f" "$A740_REV" <<'PY'
          import sys
          p, rev = sys.argv[1], sys.argv[2]
          s = open(p).read()
          old = 'f4a9fbb3da01457a35a127e62be64ab702bd2c18'
          if old in s:
              open(p, 'w').write(s.replace(old, rev))
              print(p, ': Adreno740 rev ->', rev)
          PY
          done

      - name: fixture additions (14 pairings for macOS CI LTO reference)
        working-directory: UniXNU
        run: |
          cat > "$RUNNER_TEMP/fixture-adds.json" <<'JSON'
          [
           {"original": "0xfffffff0082da0a0", "original_size": 188, "original_sha256": "54ae08508e5387a6542c3700570c50384d0bd8c8464d7e2773fd8a29b4567627", "native_symbol": "_bdevsw_isfree", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff00840095c", "original_size": 240, "original_sha256": "c32b16764d0ac2de1469ab1abf3c0c6713f646c5d804d05966dd6b74a70475ef", "native_symbol": "__ZN10IOReporter12updateReportEP19IOReportChannelListjPvS2_", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff008401f30", "original_size": 280, "original_sha256": "2e67132c10ac1ab0393a7573f87f6289d74a9e06e027cd301eb76620fae04a33", "native_symbol": "__ZN16IOSimpleReporter14incrementValueEyx", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0082dae98", "original_size": 84, "original_sha256": "7e7a472fbe2afa7b9c131c70eb5ebef2b0c30cb4e9104b3e48ab77643afa2daf", "native_symbol": "_OSTestAndSet", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0082daeec", "original_size": 84, "original_sha256": "9fbea91d137fd7eb28145dc999e8730814745bf46d8586585a5edf2b7726d452", "native_symbol": "_OSTestAndClear", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0083b40fc", "original_size": 168, "original_sha256": "2332160e1205d06f6aac63da98696ae582a76412f3b0ee5ad8253013106ca0f4", "native_symbol": "__ZN12IODMACommandD2Ev", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007d4e160", "original_size": 160, "original_sha256": "04b4e53b68595db2745d9f3ad13a2889546b532b646605c06a7cd495e6cd7c6b", "native_symbol": "_ptrauth_utils_sign_blob_generic", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007eda11c", "original_size": 40, "original_sha256": "3e0e1de2becb9dae075d20f18c3354b6b5b93b0e4e9db98f725a69620cc8d37f", "native_symbol": "_memchr", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007ee4430", "original_size": 192, "original_sha256": "f7b56fe131524ef8b66d575a9b8d79bb034b8b267ef21fca3be5dde08777326d", "native_symbol": "_buf_map_range", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007f32c80", "original_size": 200, "original_sha256": "c1d1b9fec6e94fba494a99ab6e57de41709d1bebef5c9f2d645d41643667dc11", "native_symbol": "_vnode_setmountedon", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007f32d48", "original_size": 200, "original_sha256": "59cac9e2310a08447b69f3a7749ff6de88c0098fe0cd0459a916ad34385e641f", "native_symbol": "_vnode_clearmountedon", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0083f168c", "original_size": 100, "original_sha256": "74c0c96690cc5af9c218fa5dacf170df4f629ec9822f96877585a87bc219ef6e", "native_symbol": "__ZN12IOUserClient27copyObjectForPortNameInTaskEP4taskjPP8OSObject", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0083b0570", "original_size": 196, "original_sha256": "a2f7e9341135af91bc8131bfd8cafde4e9f76fd8a0b114239ad7616b19a66a40", "native_symbol": "__ZN24IOBufferMemoryDescriptorD2Ev", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007ddd9b8", "original_size": 216, "original_sha256": "19cc4a4ab83ab54b01c890e5383b1cf3d7757bcc7b93c1e1a0a9102ce0f40a33", "native_symbol": "_thread_call_allocate_with_priority", "evidence": "CI LTO reference pairing"}
          ]
          JSON
          python3 - kits/XnuPrelink/fixtures/fileset-21H16-symbols.json "$RUNNER_TEMP/fixture-adds.json" <<'PY'
          import json, sys
          p = sys.argv[1]; f = json.load(open(p)); adds = json.load(open(sys.argv[2]))
          have = {e['original'] for e in f['functions']}
          new = [e for e in adds if e['original'] not in have]
          f['functions'].extend(new)
          json.dump(f, open(p, 'w'), indent=2); open(p, 'a').write('\n')
          print('fixture: added', len(new), 'of', len(adds), '; functions now', len(f['functions']))
          PY

      - name: prepare device, DataSkel stub, QUD git pin, WiFi/BT sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 1) Minimal DataSkel21H16.h stub (Apple bytes stay out of public repos)
          if [ ! -f device/package/DataSkel21H16.h ]; then
            cat > device/package/DataSkel21H16.h <<'H'
          struct sheng_skel_entry { const char *path; unsigned short mode; unsigned short uid, gid; unsigned char kind; unsigned short size; const char *data; };
          static const struct sheng_skel_entry sheng_skel_21h16[] = {
           {"/private/var/db", 0755, 0, 0, 0, 0, 0},
          };
          #ifndef SKEL_PATH
          #define SKEL_PATH(e) ((e)->path)
          #define SKEL_DATA(e) ((e)->data)
          #endif
          H
          fi

          # 2) QcomXnuUsbDebug real git checkout at QUD_REVISION + Kerfand overlay + author reboot fix
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost
          QUD=$(sed -n "s/^QUD_REVISION = '\([0-9a-f]*\)'.*/\1/p" device/scripts/prepare-fuxi-usb-debug.py)
          git clone -q https://github.com/xiaoleGun/QcomXnuUsbDebug.git "$RUNNER_TEMP/qud"
          git -C "$RUNNER_TEMP/qud" checkout -q "$QUD"
          cp -R device/drivers/QcomXnuUsbDebug/. "$RUNNER_TEMP/qud/"
          rm -rf device/drivers/QcomXnuUsbDebug
          mv "$RUNNER_TEMP/qud" device/drivers/QcomXnuUsbDebug
          if ! grep -q dwc3_failure_state device/drivers/QcomXnuUsbDebug/usb/Dwc3.c; then
            git -C device/drivers/QcomXnuUsbDebug apply --verbose "$GITHUB_WORKSPACE/ci-self/.github/fuxi/qud-author-reboot-fix.patch"
          fi
          grep -c dwc3_failure_state device/drivers/QcomXnuUsbDebug/usb/Dwc3.c

          # 2b) Kerfand ceb99ca (layout-2026-11-26) Bluetooth, verbatim: FuxiBluetooth.cpp VSC fix + launch constraint for BlueTool/fuxi-logdump
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/k-ceb99ca/FuxiBluetooth.cpp" device/package/FuxiBluetooth.cpp
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/k-ceb99ca/CpuFreqProbe.cpp" device/package/CpuFreqProbe.cpp
          # 2b2) Kerfand ceb99ca baseband (FuxiModem*, modem GLINK/QRTR, IPA, COACHZ bridge), verbatim; fuxi-modem=15 coachz-baseband=1
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/port-ceb-baseband.py"
          # Claude+Gemini 11-28: no IOMallocZero in the IPCC interrupt (gOwner lazy alloc -> zalloc panic without fuxi-modem)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-modem-irqfix.py" device device-ios17 UniXNU
          # Gemini 11-28: ApplePPM CPMSSupported 0xffffffff -> 0x80 (bit 7 baseband only; stops audiomxd bit 8 crash)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-ppm-bb-only.py" device device-ios17 UniXNU
          # claude 11-28: hardware watchdog armed before the modem probe (bbsel boot 1 hung there with no watchdog yet)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-hwdt-early.py" device device-ios17 UniXNU
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/k-ceb99ca/zz-btd-launch-constraint.patch" UniXNU/patches/xnu-10063-arm64e/zz-btd-launch-constraint.patch
          grep -c gVscFixed device/package/FuxiBluetooth.cpp
          grep -c fuxi-logdump UniXNU/patches/xnu-10063-arm64e/zz-btd-launch-constraint.patch
          # Kerfand ceb99ca zz-vmm-hide.patch verbatim: fuxi-vmm-hide=1 -> user processes read kern.hv_vmm_present 0 (HasBaseband) (claude 11-28)
          # Claude 11-28: Kerfand 2a1c720 verbatim: vmm-hide on with fuxi-modem (AMP patches dropped: no frames / hard hang here)
          for x in zz-vmm-hide; do cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/k-2a1c720/$x.patch" UniXNU/patches/xnu-10063-arm64e/$x.patch; done
          # Gemini 11-28: 3-stage single-copy Mav16 baseband firmware union-mount (Kerfand 2a1c720 zz-xpc-manifest-mount firmware parts)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-patch-bb-fw-mount.py" UniXNU/patches/xnu-10063-arm64e/ios17-zaudio-hal-mount.patch
          # 2c) fuxi-oslog=<process>: Kerfand oslog mirror for any process (default bluetoothd), in-line edits only
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/oslog-any.py" UniXNU/patches/xnu-10063-arm64e/zz-btd-oslog-probe.patch
          grep -c fuxi-oslog UniXNU/patches/xnu-10063-arm64e/zz-btd-oslog-probe.patch

          # 3) Init single-commit git repos for device and drivers so build scripts can call git rev-parse HEAD
          for r in device/drivers/*/ device/kits/*/ device; do
            [ -d "$r" ] || continue
            [ -e "$r/.git" ] && continue
            git -C "$r" init -q && git -C "$r" add -A && git -C "$r" commit -q -m "Kerfand ${{ inputs.kerfand_ref }}" && echo "git: $r"
          done

          # 4) Ath12kWifiLegacy Linux/FreeBSD deps
          if [ ! -f device/drivers/Ath12kWifiLegacy/deps/linux/drivers/bus/mhi/host/boot.c ]; then
            for i in 1 2 3; do
              bash device/drivers/Ath12kWifiLegacy/tools/fetch-sources.sh && break
              rm -rf device/drivers/Ath12kWifiLegacy/deps; sleep 20
            done
          fi
          ls device/drivers/Ath12kWifiLegacy/deps/linux/drivers/bus/mhi/host/boot.c

          # 5) QcaBluetooth Linux btqca.c/.h (already in 0003, verify)
          if [ ! -f UniXNU/drivers/QcaBluetooth/out/linux/btqca.h ]; then
            for i in 1 2 3; do
              (cd UniXNU/drivers/QcaBluetooth && python3 tools/prepare-linux.py) && break
              sleep 20
            done
          fi
          ls UniXNU/drivers/QcaBluetooth/out/linux/btqca.h UniXNU/drivers/QcaBluetooth/out/linux/btqca.c

      - name: layer our enhancements (#10 nodim, #11 apps, FuxiHwdt, rstfix, QUD allowlist, 16K ring, -Wno-shadow)
        run: |
          set -euo pipefail
          # 1) #10 Lock screen no-dim (managed com.apple.springboard.plist)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/port-nodim-apps.py" nodim \
            $(find device device-ios17 -name BootWatchdogPolicy.c -type f)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/mkdir-managed-prefs.py" \
            $(find device device-ios17 -name BootWatchdogPolicy.c -type f)

          # 1b) Fix fuxi_boot_dictation_prefs EFAULT (rc 14): dictation_body (~6.5 KB) overflows 4 KB scratch page!
          # Write it in 2048-byte chunks into scratch+0x200 so com.apple.keyboard.preferences.plist writes cleanly (rc 0).
          for f in $(find device device-ios17 -name BootWatchdogPolicy.c -type f); do
            python3 - "$f" <<'PYCHUNK'
          import sys
          p = sys.argv[1]; t = open(p).read()
          old = (
              '   error=copyout(dictation_body,scratch+0x200,sizeof(dictation_body)-1);\n'
              '   if(!error){struct write_args wr={.fd=fd,.cbuf=scratch+0x200,.nbyte=sizeof(dictation_body)-1};user_ssize_t n=0;error=write(p,&wr,&n);\n'
              '    if(!error && n!=(user_ssize_t)(sizeof(dictation_body)-1))error=EIO;}\n'
          )
          new = (
              '   for(size_t off=0; !error && off < sizeof(dictation_body)-1; ) {\n'
              '    size_t chunk = sizeof(dictation_body)-1 - off;\n'
              '    if(chunk > 0x1f0) chunk = 0x1f0;\n'
              '    error = copyout(dictation_body + off, scratch + 0x200, chunk);\n'
              '    if(!error){struct write_args wr={.fd=fd,.cbuf=scratch+0x200,.nbyte=chunk};user_ssize_t n=0;error=write(p,&wr,&n);\n'
              '     if(!error && n!=(user_ssize_t)chunk)error=EIO;}\n'
              '    off += chunk;\n'
              '   }\n'
          )
          assert t.count(old) == 1, f'dictation_body write anchor not found in {p}'
          open(p, 'w').write(t.replace(old, new, 1))
          print('chunked dictation_body write patched in', p)
          PYCHUNK
          done

          # 1c) v4: one-shot SplashBoard snapshot reset (fuxi-splash-reset=1) + MDSS DPU Hz probe & optional fuxi-panel-hz=60|90|120
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" watchdog \
            $(find device device-ios17 UniXNU -name BootWatchdogPolicy.c -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" backlight \
            $(find device device-ios17 UniXNU -name AppleARMBacklight.cpp -type f 2>/dev/null)
          # 1c-2) hw-vsync: 统计面板 INTF vsync 中断（hw-vsync=1，只观测不改时序）
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-hw-vsync.py" hwvsync \
            $(find device device-ios17 UniXNU -name AppleARMBacklight.cpp -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" gpupower \
            $(find device device-ios17 UniXNU -name GpuPowerProbe.cpp -type f 2>/dev/null)
