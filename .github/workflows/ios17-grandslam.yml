          # widgets: fuxi-mig-sentinel=1 creates /private/var/datamigrator/migrate (DataMigrator runs without a build change)
          for f in $(find device device-ios17 UniXNU -name BootWatchdogPolicy.c -type f 2>/dev/null); do
            python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-mig-sentinel.py" "$f"
