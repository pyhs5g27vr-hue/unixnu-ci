name: fuxi iOS 17 Grand-Slam (Kerfand f0ae963 + all local enhancements)

# Reconstructs Kerfand's latest snapshot via tools/reconstruct.sh (Safari, keyboard 3-piece,
# Adreno740 1c9029b + AdrenoMetal c9ebd2fb + scanout_scale, Wi-Fi DMA cache, PPS/PD fast charge,
# Audio/buttons, 8-core support, RTC/timezone, DPU direct + GPU handoff, zz-protection-class-none)
# and layers our verified local additions: FuxiHwdt (fuxi-hwdt=20), #10 nodim, #11 apps union,
# QUD reboot/rstfix, 16 KiB USB log ring, and smart FuxiStatusBar-14p-120hz.c.

on:
  workflow_dispatch:
    inputs:
      kerfand_ref:
        description: Kerfand/UniXNU-Fuxi-Arm64e-iOS17 ref (with tools/reconstruct.sh)
        required: true
        default: f0ae963b674c53a9c1fa5836bfcf89d38bbf77c9
      build_kernel:
        description: Build the kernel
        type: boolean
        default: true
      build_addon:
        description: Build kernel.macho.gpuaddon (Turnip, Metal plugin, FuxiStatusBar-14p-120hz, trust)
        type: boolean
        default: true
      runner:
        description: macOS runner label
        required: true
        default: macos-26

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  AGE_RECIPIENT: age10kh2jlkf7c3hcnuylu9l7gmzly9z6d983ez2epawumlu7fz4myrqj6de0n
  IPSW_URL: https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-79094/90CE304F-6C16-402E-96C9-89260D93CA82/iPhone15,2_17.7_21H16_Restore.ipsw

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ ! -d "$DEVELOPER_DIR" ]; then
            X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"; echo "using $X"
          fi

      - uses: actions/checkout@v4
        with:
          path: ci-self
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Kerfand/UniXNU-Fuxi-Arm64e-iOS17
          ref: ${{ inputs.kerfand_ref }}
          path: kerfand
          persist-credentials: false

      - name: reconstruct full Kerfand tree (tools/reconstruct.sh)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Authenticate GitHub clones via extraHeader (NOT url.insteadOf! insteadOf rewrites origin URLs
          # to https://x-access-token:...@github.com/... which breaks UniXNU components.py official_alias()
          # and drops legacy_name symlinks like SoftwareAES -> NativeAES).
          B64=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git config --global "http.https://github.com/.extraHeader" "AUTHORIZATION: basic $B64"
          bash kerfand/tools/reconstruct.sh "$GITHUB_WORKSPACE"
          git -C UniXNU log --oneline -5
          git -C UniXNU/drivers/Adreno740 log --oneline -3
          git -C UniXNU/drivers/AdrenoMetal log --oneline -3
          git -C UniXNU/drivers/GopFramebuffer log --oneline -3
          git -C UniXNU/drivers/ArmCpu log --oneline -2
          ls -la UniXNU/drivers/SoftwareAES/OriginalAESABI.h
          # Record the reconstructed local submodule commits in UniXNU so `./unixnu build`
          # does not try to fetch Kerfand's old unpushed submodule SHAs from origin.
          for sm in drivers/Adreno740 drivers/AdrenoMetal drivers/AppleKeyStoreState drivers/ArmCpu drivers/GopFramebuffer kits/XnuPrelink; do
            [ -d "UniXNU/$sm" ] && git -C UniXNU add "$sm"
          done
          git -C UniXNU -c user.name=ci -c user.email=ci@localhost commit -q -m "fuxi: record reconstructed submodule pins" || true
          # User preference: never draw colored boot-stage squares or blue/white beat block on screen.
          python3 - UniXNU/patches/xnu-10063-arm64e/screen-quiet-after-swap.patch <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          old = '+\treturn &native_legacy_swapstat[0] != NULL && native_legacy_swapstat[0] != 0;\n'
          new = '+\t(void)native_legacy_swapstat; return true;\n'
          assert old in s, 'screen-quiet anchor'
          open(p, 'w').write(s.replace(old, new, 1))
          print('screen-quiet-after-swap: colored boot squares disabled completely')
          PY
          # Port upstream rk3588-wc-batch-flush.patch: flush+invalidate dirty zero lines on batch VM_WIMG_WCOMB transitions
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/fuxi-wc-batch-flush.patch" UniXNU/patches/xnu-10063-arm64e/zzz-wc-batch-flush.patch
          # Ensure zz-msg-probe.patch and zzz-webkit-msg-probe.patch declare proc_pid for RELEASE LTO reference
          for mp in UniXNU/patches/xnu-10063-arm64e/zz-msg-probe.patch UniXNU/patches/xnu-10063-arm64e/zzz-webkit-msg-probe.patch; do
            [ -f "$mp" ] && python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/zz-msg-probe-fix.py" "$mp"
          done
          # Reconstructed drivers/Adreno740 has identical content to f4a9fbb3... with a fresh local commit hash;
          # update prepare-fuxi-driver-compat.py to recognize the reconstructed HEAD.
          A740_REV=$(git -C UniXNU/drivers/Adreno740 rev-parse HEAD)
          for f in device/scripts/prepare-fuxi-driver-compat.py device-ios17/scripts/prepare-fuxi-driver-compat.py; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            python3 - "$f" "$A740_REV" <<'PY'
          import sys
          p, rev = sys.argv[1], sys.argv[2]
          s = open(p).read()
          old = 'f4a9fbb3da01457a35a127e62be64ab702bd2c18'
          if old in s:
              open(p, 'w').write(s.replace(old, rev))
              print(p, ': Adreno740 rev ->', rev)
          PY
          done

      - name: fixture additions (14 pairings for macOS CI LTO reference)
        working-directory: UniXNU
        run: |
          cat > "$RUNNER_TEMP/fixture-adds.json" <<'JSON'
          [
           {"original": "0xfffffff0082da0a0", "original_size": 188, "original_sha256": "54ae08508e5387a6542c3700570c50384d0bd8c8464d7e2773fd8a29b4567627", "native_symbol": "_bdevsw_isfree", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff00840095c", "original_size": 240, "original_sha256": "c32b16764d0ac2de1469ab1abf3c0c6713f646c5d804d05966dd6b74a70475ef", "native_symbol": "__ZN10IOReporter12updateReportEP19IOReportChannelListjPvS2_", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff008401f30", "original_size": 280, "original_sha256": "2e67132c10ac1ab0393a7573f87f6289d74a9e06e027cd301eb76620fae04a33", "native_symbol": "__ZN16IOSimpleReporter14incrementValueEyx", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0082dae98", "original_size": 84, "original_sha256": "7e7a472fbe2afa7b9c131c70eb5ebef2b0c30cb4e9104b3e48ab77643afa2daf", "native_symbol": "_OSTestAndSet", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0082daeec", "original_size": 84, "original_sha256": "9fbea91d137fd7eb28145dc999e8730814745bf46d8586585a5edf2b7726d452", "native_symbol": "_OSTestAndClear", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0083b40fc", "original_size": 168, "original_sha256": "2332160e1205d06f6aac63da98696ae582a76412f3b0ee5ad8253013106ca0f4", "native_symbol": "__ZN12IODMACommandD2Ev", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007d4e160", "original_size": 160, "original_sha256": "04b4e53b68595db2745d9f3ad13a2889546b532b646605c06a7cd495e6cd7c6b", "native_symbol": "_ptrauth_utils_sign_blob_generic", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007eda11c", "original_size": 40, "original_sha256": "3e0e1de2becb9dae075d20f18c3354b6b5b93b0e4e9db98f725a69620cc8d37f", "native_symbol": "_memchr", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007ee4430", "original_size": 192, "original_sha256": "f7b56fe131524ef8b66d575a9b8d79bb034b8b267ef21fca3be5dde08777326d", "native_symbol": "_buf_map_range", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007f32c80", "original_size": 200, "original_sha256": "c1d1b9fec6e94fba494a99ab6e57de41709d1bebef5c9f2d645d41643667dc11", "native_symbol": "_vnode_setmountedon", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007f32d48", "original_size": 200, "original_sha256": "59cac9e2310a08447b69f3a7749ff6de88c0098fe0cd0459a916ad34385e641f", "native_symbol": "_vnode_clearmountedon", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0083f168c", "original_size": 100, "original_sha256": "74c0c96690cc5af9c218fa5dacf170df4f629ec9822f96877585a87bc219ef6e", "native_symbol": "__ZN12IOUserClient27copyObjectForPortNameInTaskEP4taskjPP8OSObject", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff0083b0570", "original_size": 196, "original_sha256": "a2f7e9341135af91bc8131bfd8cafde4e9f76fd8a0b114239ad7616b19a66a40", "native_symbol": "__ZN24IOBufferMemoryDescriptorD2Ev", "evidence": "CI LTO reference pairing"},
           {"original": "0xfffffff007ddd9b8", "original_size": 216, "original_sha256": "19cc4a4ab83ab54b01c890e5383b1cf3d7757bcc7b93c1e1a0a9102ce0f40a33", "native_symbol": "_thread_call_allocate_with_priority", "evidence": "CI LTO reference pairing"}
          ]
          JSON
          python3 - kits/XnuPrelink/fixtures/fileset-21H16-symbols.json "$RUNNER_TEMP/fixture-adds.json" <<'PY'
          import json, sys
          p = sys.argv[1]; f = json.load(open(p)); adds = json.load(open(sys.argv[2]))
          have = {e['original'] for e in f['functions']}
          new = [e for e in adds if e['original'] not in have]
          f['functions'].extend(new)
          json.dump(f, open(p, 'w'), indent=2); open(p, 'a').write('\n')
          print('fixture: added', len(new), 'of', len(adds), '; functions now', len(f['functions']))
          PY

      - name: prepare device, DataSkel stub, QUD git pin, WiFi/BT sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 1) Minimal DataSkel21H16.h stub (Apple bytes stay out of public repos)
          if [ ! -f device/package/DataSkel21H16.h ]; then
            cat > device/package/DataSkel21H16.h <<'H'
          struct sheng_skel_entry { const char *path; unsigned short mode; unsigned short uid, gid; unsigned char kind; unsigned short size; const char *data; };
          static const struct sheng_skel_entry sheng_skel_21h16[] = {
           {"/private/var/db", 0755, 0, 0, 0, 0, 0},
          };
          #ifndef SKEL_PATH
          #define SKEL_PATH(e) ((e)->path)
          #define SKEL_DATA(e) ((e)->data)
          #endif
          H
          fi

          # 2) QcomXnuUsbDebug real git checkout at QUD_REVISION + Kerfand overlay + author reboot fix
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost
          QUD=$(sed -n "s/^QUD_REVISION = '\([0-9a-f]*\)'.*/\1/p" device/scripts/prepare-fuxi-usb-debug.py)
          git clone -q https://github.com/xiaoleGun/QcomXnuUsbDebug.git "$RUNNER_TEMP/qud"
          git -C "$RUNNER_TEMP/qud" checkout -q "$QUD"
          cp -R device/drivers/QcomXnuUsbDebug/. "$RUNNER_TEMP/qud/"
          rm -rf device/drivers/QcomXnuUsbDebug
          mv "$RUNNER_TEMP/qud" device/drivers/QcomXnuUsbDebug
          if ! grep -q dwc3_failure_state device/drivers/QcomXnuUsbDebug/usb/Dwc3.c; then
            git -C device/drivers/QcomXnuUsbDebug apply --verbose "$GITHUB_WORKSPACE/ci-self/.github/fuxi/qud-author-reboot-fix.patch"
          fi
          grep -c dwc3_failure_state device/drivers/QcomXnuUsbDebug/usb/Dwc3.c

          # 3) Init single-commit git repos for device and drivers so build scripts can call git rev-parse HEAD
          for r in device/drivers/*/ device/kits/*/ device; do
            [ -d "$r" ] || continue
            [ -e "$r/.git" ] && continue
            git -C "$r" init -q && git -C "$r" add -A && git -C "$r" commit -q -m "Kerfand ${{ inputs.kerfand_ref }}" && echo "git: $r"
          done

          # 4) Ath12kWifiLegacy Linux/FreeBSD deps
          if [ ! -f device/drivers/Ath12kWifiLegacy/deps/linux/drivers/bus/mhi/host/boot.c ]; then
            for i in 1 2 3; do
              bash device/drivers/Ath12kWifiLegacy/tools/fetch-sources.sh && break
              rm -rf device/drivers/Ath12kWifiLegacy/deps; sleep 20
            done
          fi
          ls device/drivers/Ath12kWifiLegacy/deps/linux/drivers/bus/mhi/host/boot.c

          # 5) QcaBluetooth Linux btqca.c/.h (already in 0003, verify)
          if [ ! -f UniXNU/drivers/QcaBluetooth/out/linux/btqca.h ]; then
            for i in 1 2 3; do
              (cd UniXNU/drivers/QcaBluetooth && python3 tools/prepare-linux.py) && break
              sleep 20
            done
          fi
          ls UniXNU/drivers/QcaBluetooth/out/linux/btqca.h UniXNU/drivers/QcaBluetooth/out/linux/btqca.c

      - name: layer our enhancements (#10 nodim, #11 apps, FuxiHwdt, rstfix, QUD allowlist, 16K ring, -Wno-shadow)
        run: |
          set -euo pipefail
          # 1) #10 Lock screen no-dim (managed com.apple.springboard.plist)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/port-nodim-apps.py" nodim \
            $(find device device-ios17 -name BootWatchdogPolicy.c -type f)

          # 1b) Fix fuxi_boot_dictation_prefs EFAULT (rc 14): dictation_body (~6.5 KB) overflows 4 KB scratch page!
          # Write it in 2048-byte chunks into scratch+0x200 so com.apple.keyboard.preferences.plist writes cleanly (rc 0).
          for f in $(find device device-ios17 -name BootWatchdogPolicy.c -type f); do
            python3 - "$f" <<'PYCHUNK'
          import sys
          p = sys.argv[1]; t = open(p).read()
          old = (
              '   error=copyout(dictation_body,scratch+0x200,sizeof(dictation_body)-1);\n'
              '   if(!error){struct write_args wr={.fd=fd,.cbuf=scratch+0x200,.nbyte=sizeof(dictation_body)-1};user_ssize_t n=0;error=write(p,&wr,&n);\n'
              '    if(!error && n!=(user_ssize_t)(sizeof(dictation_body)-1))error=EIO;}\n'
          )
          new = (
              '   for(size_t off=0; !error && off < sizeof(dictation_body)-1; ) {\n'
              '    size_t chunk = sizeof(dictation_body)-1 - off;\n'
              '    if(chunk > 0x1f0) chunk = 0x1f0;\n'
              '    error = copyout(dictation_body + off, scratch + 0x200, chunk);\n'
              '    if(!error){struct write_args wr={.fd=fd,.cbuf=scratch+0x200,.nbyte=chunk};user_ssize_t n=0;error=write(p,&wr,&n);\n'
              '     if(!error && n!=(user_ssize_t)chunk)error=EIO;}\n'
              '    off += chunk;\n'
              '   }\n'
          )
          assert t.count(old) == 1, f'dictation_body write anchor not found in {p}'
          open(p, 'w').write(t.replace(old, new, 1))
          print('chunked dictation_body write patched in', p)
          PYCHUNK
          done

          # 1c) v4: one-shot SplashBoard snapshot reset (fuxi-splash-reset=1) + MDSS DPU Hz probe & optional fuxi-panel-hz=60|90|120
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" watchdog \
            $(find device device-ios17 UniXNU -name BootWatchdogPolicy.c -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" backlight \
            $(find device device-ios17 UniXNU -name AppleARMBacklight.cpp -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" gpupower \
            $(find device device-ios17 UniXNU -name GpuPowerProbe.cpp -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" fwslot \
            $(find device device-ios17 UniXNU -name FuxiAdspFirmware.cpp -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" modem \
            $(find device device-ios17 UniXNU -name ModemProbe.cpp -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" adsp \
            $(find device device-ios17 UniXNU -name AdspProbe.cpp -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" submit \
            $(find UniXNU device device-ios17 -name NativeAdrenoSubmit.cpp -type f 2>/dev/null)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/patch-v4-splash-panelhz.py" noibdump \
            $(find device-ios17 kerfand -name build-ios17-legacy-display.py -type f 2>/dev/null)

          # 2) #11 33 System Apps (/Applications union + call swap)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/port-nodim-apps.py" apps \
            device/patches/xnu/zzy-staged-system-apps.patch

          # 3) Hardware watchdog (FuxiHwdt.inc.c -> fuxi-hwdt=20)
          n=0
          for f in $(find device device-ios17 UniXNU -name BootWatchdogPolicy.c -type f 2>/dev/null); do
            grep -q 'fuxi_hwdt_start' "$f" && { echo "already: $f"; continue; }
            python3 - "$f" "$GITHUB_WORKSPACE/ci-self/.github/fuxi/FuxiHwdt.inc.c" <<'PY'
          import sys
          p, inc = sys.argv[1], open(sys.argv[2]).read()
          t = open(p).read()
          sig = 'int sheng_boot_watchdog_policy(void *process, uint64_t scratch) {\n'
          assert t.count(sig) == 1, 'sheng_boot_watchdog_policy anchor'
          head = '// fuxi hardware watchdog (included below)\nstatic void fuxi_hwdt_start(void);\n'
          t = t.replace(sig, sig + ' fuxi_hwdt_start();\n', 1)
          i = t.index('static const char policy_head[]')
          t = t[:i] + head + t[i:] + '\n' + inc
          open(p, 'w').write(t); print('hwdt added to', p)
          PY
            n=$((n+1))
          done
          test "$n" -ge 1

          # 4) rstfix (failed bootloader flag -> plain PSCI reset)
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/rstfix-qud.py" \
            device/scripts/build-fuxi-usb-debug.py device-ios17/scripts/build-fuxi-usb-debug.py

          # 5) Skip QUD host model test (test_usb_buffer relocated-buffer trips on macOS runner) + shrink USB log ring 32->16 KiB
          for f in device/scripts/build-fuxi-usb-debug.py device-ios17/scripts/build-fuxi-usb-debug.py; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; t = open(p).read()
          old = ("run([sys.executable, module / 'tests/check.py', '--target-clang', llvm / 'clang',\n"
                 "     '--output', root / '.cache/fuxi-qud-model-check'], host=True)")
          if old in t:
              t = t.replace(old, "(root / '.cache/fuxi-qud-model-check').mkdir(parents=True, exist_ok=True)\n"
                                 "(root / '.cache/fuxi-qud-model-check/check-report.json').write_text('{\"skipped\": \"ci\"}\\n')")
              print(p, ': model check skipped')
          if "'#define SOC_USB_LOG_BUFFER_BYTES (32u * 1024u)'" in t:
              t = t.replace("'#define SOC_USB_LOG_BUFFER_BYTES (32u * 1024u)'",
                            "'#define SOC_USB_LOG_BUFFER_BYTES (16u * 1024u)'")
              print(p, ': USB log ring 32 -> 16 KiB')
          open(p, 'w').write(t)
          PY
          done

          # 6) QUD import allowlist (fuxi_control_input, touch inject, direct snapshot)
          for f in $(find device device-ios17 -path '*QcomXnuUsbDebug/scripts/build.py' -type f); do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          extras = [
              '_fuxi_control_input', 'l_fuxi_control_input.ptrauth',
              '_fuxi_touch_inject', 'l_fuxi_touch_inject.ptrauth',
              '_fuxi_control_touch', 'l_fuxi_control_touch.ptrauth',
              '_native_legacy_direct_snapshot', 'l_native_legacy_direct_snapshot.ptrauth',
          ]
          missing = [x for x in extras if repr(x) not in s]
          if missing:
              old = "allowed = {"
              assert s.count(old) == 1, (p, s.count(old))
              ins = ', '.join(repr(x) for x in missing) + ', '
              s = s.replace(old, old + ins, 1)
              open(p, 'w').write(s)
              print(p, ': added allowlist', missing)
          PY
          done

          # 7) Tolerate BootWatchdogPolicy shadow warnings (-Wno-shadow)
          for f in $(find device device-ios17 -name 'build-ios17-legacy-display.py' -type f); do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; t = open(p).read()
          old = "['-mgeneral-regs-only', '-Wall', '-Wextra', '-Werror']"
          new = "['-mgeneral-regs-only', '-Wall', '-Wextra', '-Wno-shadow']"
          if old in t:
              open(p, 'w').write(t.replace(old, new, 1))
              print(p, ': -Wno-shadow added')
          PY
          done

          # 8) Authenticated GitHub API firmware downloads
          for f in $(find device device-ios17 -name fuxi_adreno_common.py -type f); do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old = "                'Accept': 'application/vnd.github.raw+json',\n            })\n"
          if old in s and "GITHUB_TOKEN" not in s:
              new = old + "            if os.environ.get('GITHUB_TOKEN'):\n                request.add_header('Authorization', 'Bearer ' + os.environ['GITHUB_TOKEN'])\n"
              s = s.replace(old, new, 1)
              if '\nimport os' not in s and 'import os,' not in s:
                  s = 'import os\n' + s if not s.startswith('#!') else s.replace('\n', '\nimport os\n', 1)
              open(p, 'w').write(s)
              print(p, ': GITHUB_TOKEN auth added')
          PY
          done

      - name: uefi-fuxi (pinned fuxi.dtb)
        run: |
          git clone -q --filter=blob:none https://github.com/ljhhkx529/uefi-fuxi.git uefi-fuxi
          git -C uefi-fuxi checkout -q 57969ab77d36a982261daef16592741ed4a1d811
          shasum -a 256 uefi-fuxi/Resources/DTBs/fuxi.dtb
          echo "FUXI_DTB=$GITHUB_WORKSPACE/uefi-fuxi/Resources/DTBs/fuxi.dtb" >> "$GITHUB_ENV"

      - name: VerifiedRoot inputs (header-only)
        env:
          VROOT_INPUTS: ${{ secrets.VROOT_INPUTS }}
        run: |
          test -n "$VROOT_INPUTS" || { echo "secrets.VROOT_INPUTS not set"; exit 1; }
          V="$RUNNER_TEMP/vroot"; mkdir -p "$V"; printf '%s' "$VROOT_INPUTS" | base64 -d | tar -xzf - -C "$V"; ls -la "$V"/os
          echo "VERIFIED_ROOT_DIR=$V" >> "$GITHUB_ENV"
          python3 - device-ios17/scripts/build-ios17-verified-root.py <<'PY'
          import sys
          p = sys.argv[1]; t = open(p).read()
          a = t.index("    manifest = (policy / 'manifest.bin').read_bytes()")
          b = t.index("the signed header does not carry the table digest')") + len("the signed header does not carry the table digest')")
          t = t[:a] + "    image_bytes = struct.unpack_from('<Q', header, 24)[0]; block_count = (image_bytes + 4095) // 4096" + t[b:]
          t = t.replace("table_bytes=len(manifest) - 544, table_sha256=hashlib.sha256(manifest[544:]).hexdigest(),",
                        "table_bytes=block_count * 32, table_sha256='',")
          a = t.index("report = json.loads(IMAGE.with_name('userdata-root.json').read_text())")
          b = t.index("samples.write_bytes(data)") + len("samples.write_bytes(data)")
          t = t[:a] + ("count = records[0]['block_count']\nindices = [0, 1, count // 2, count - 1]\n"
                       "lengths = [4096, 4096, 4096, records[0]['image_bytes'] - (count - 1) * 4096]\n"
                       "samples = out / 'original-samples.bin'\nsamples.write_bytes(bytes(4 * 4096))") + t[b:]
          open(p, 'w').write(t); print('header-only patch applied')
          PY

      - name: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew install vulkan-headers vulkan-loader dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup age unifdef
          if [ "$(brew --prefix)" != /opt/homebrew ] && [ ! -e /opt/homebrew/opt ]; then
            sudo mkdir -p /opt/homebrew; sudo ln -s "$(brew --prefix)/opt" /opt/homebrew/opt
          fi
          brew install blacktop/tap/ipsw || true
          if ! command -v ipsw >/dev/null; then
            A=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/blacktop/ipsw/releases/latest |
                python3 -c 'import json,sys,platform; a=[x["browser_download_url"] for x in json.load(sys.stdin)["assets"]]; m="x86_64" if platform.machine()=="x86_64" else "arm64"; c=[u for u in a if u.rsplit("/",1)[-1].startswith("ipsw_") and "macOS" in u and u.endswith(".tar.gz") and "frida" not in u and ("universal" in u or m in u)]; print(c[0])')
            mkdir -p "$RUNNER_TEMP/ipsw"; curl -fsSL "$A" | tar xz -C "$RUNNER_TEMP/ipsw"
            sudo install -m 0755 "$(find "$RUNNER_TEMP/ipsw" -name ipsw -type f | head -1)" /usr/local/bin/ipsw
          fi
          ipsw version
          RB=$(brew --prefix rustup 2>/dev/null)/bin
          export PATH="$RB:$HOME/.cargo/bin:$PATH"
          {
            echo "$RB"; echo "$HOME/.cargo/bin"; echo "/opt/homebrew/opt/llvm/bin"; echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"; echo "$(brew --prefix unifdef)/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          rustup target add aarch64-apple-ios --toolchain 1.98.0
          xcrun --sdk iphoneos --show-sdk-version

      - name: kernelcache 21H16
        if: ${{ inputs.build_kernel }}
        run: |
          D="$GITHUB_WORKSPACE/UniXNU/out-ios17/ipsw/21H16"; mkdir -p "$D" "$RUNNER_TEMP/kc"
          ipsw extract --kernel --remote "$IPSW_URL" -o "$RUNNER_TEMP/kc"
          RAW=$(find "$RUNNER_TEMP/kc" -iname 'kernelcache.release.iphone15*' -type f | head -1)
          test -n "$RAW"
          ipsw kernel dec "$RAW" -o "$RUNNER_TEMP/kc" || true
          DEC=$(find "$RUNNER_TEMP/kc" -name '*.decompressed' -type f | head -1)
          if [ -z "$DEC" ] && [ "$(head -c 4 "$RAW" | xxd -p)" = "cffaedfe" ]; then DEC=$RAW; fi
          test -n "$DEC"; cp "$DEC" "$D/kernelcache.decompressed"; ls -la "$D"

      - name: tree only (no kernel)
        if: ${{ !inputs.build_kernel }}
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_XNU_ARCH: arm64e
        run: |
          export UNIXNU_OUT="$PWD/out-ios17"
          ./unixnu defconfig fuxi_ios17_kernel_defconfig -D ../device-ios17
          ./unixnu tree -D ../device-ios17
          ls out-ios17/fuxi/tree/scripts | grep -E 'turnip|metal-plugin|statusbar|gpu-addon'

      - name: build kernel
        if: ${{ inputs.build_kernel }}
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_XNU_ARCH: arm64e
          UNIXNU_FILESET_KERNEL_FIRST: 1
          XNU_KERNEL_CHAINED_FIXUPS: 1
          JOBS: 4
        run: |
          export UNIXNU_OUT="$PWD/out-ios17" UNIXNU_KERNELCACHE="$PWD/out-ios17/ipsw/21H16/kernelcache.decompressed"
          [ -f ../device/scripts/extract-files.py ] && python3 ../device/scripts/extract-files.py --device ../device || echo "extract-files skipped"
          ./unixnu defconfig fuxi_ios17_kernel_defconfig -D ../device-ios17
          T="$PWD/out-ios17/fuxi/tree"
          REF="$T/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf"
          if ! ./unixnu build kernel -D ../device-ios17 -j 4; then
            test -d "$T/.cache/xnu-work"
            echo "=== RELEASE LTO reference"
            python3 - "$T/scripts/build-fileset-release-reference.py" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old = "    if stub_names:\n"
          new = '''    demangled = sorted(set(re.findall(r'^\\s+"([^_"][^"]*)", referenced from', blocks[-1], re.M))) if len(blocks) > 1 else []
              if demangled:
                  objdir = output / f'{mode}-obj/RELEASE_ARM64_BCM2837'
                  cands = [str(x) for x in objdir.rglob('*.o')] + [str(x) for x in objdir.rglob('*.a')]
                  mangled = set()
                  for i in range(0, len(cands), 200):
                      r = subprocess.run(['xcrun', 'nm', '-uj', *cands[i:i + 200]], capture_output=True, text=True)
                      mangled.update(l.strip() for l in r.stdout.splitlines() if l.strip().startswith('__Z'))
                  mangled = sorted(mangled)
                  plain = subprocess.run(['xcrun', 'c++filt', '-_'], input='\\n'.join(mangled), capture_output=True, text=True).stdout.splitlines()
                  want = set(demangled)
                  extra = [m for m, d in zip(mangled, plain) if d.strip() in want]
                  if 'OSValueObject<int>::MetaClass::MetaClass()' in want: extra.append('__ZN13OSValueObjectIiE9MetaClassC1Ev')
                  for m in list(extra):
                      for a, b in (('C1E', 'C2E'), ('C2E', 'C1E'), ('D1E', 'D2E'), ('D2E', 'D1E')):
                          if a in m: extra.append(m.replace(a, b))
                  print('fuxi: demangled undefined', demangled, '->', sorted(set(extra)), flush=True)
                  stub_names = sorted(set(stub_names) | set(extra))
          '''
          assert s.count(old) == 1, 'stub anchor'
          s = s.replace(old, new + old, 1)
          open(p, 'w').write(s)
          PY
            ( cd "$T" && python3 scripts/build-fileset-release-reference.py --tree "$T" --lto ) || {
              L=$(ls -t "$T"/build/xnu/fileset-reference/*/lto-build.log | head -1)
              grep -n ' error: \|: fatal error\|Undefined symbols\|\*\*\* \[' "$L" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400 | head -60 || true
              tail -30 "$L"; exit 1
            }
            cp "$REF" "$RUNNER_TEMP/reference.noctf"
            ./unixnu build kernel -D ../device-ios17 -j 4 || {
              mkdir -p "$(dirname "$REF")"; cp "$RUNNER_TEMP/reference.noctf" "$REF"
              ./unixnu build kernel -D ../device-ios17 -j 4
            }
          fi
          find out-ios17 -name kernel.macho -print

      - name: kernel build errors (on failure)
        if: ${{ failure() && inputs.build_kernel }}
        working-directory: UniXNU
        run: |
          for f in out-ios17/fuxi/logs/*.log; do
            n=$(grep -c ' error: \|error: undefined\|Undefined symbols\|ld: ' "$f" 2>/dev/null || true)
            [ "${n:-0}" -gt 0 ] || continue
            echo "== $f ($n)"; grep -n ' error: \|error: undefined\|Undefined symbols\|ld: ' "$f" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400 | head -40
            grep -A 60 'Undefined symbols' "$f" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-300 | head -80 || true
          done

      - name: Prepare Mesa, translator and Mesa venv
        if: ${{ success() && inputs.build_addon }}
        working-directory: UniXNU
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out-ios17/fuxi/tree
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          ROOT = Path.cwd()
          def run(*cmd):
              subprocess.run([str(c) for c in cmd], check=True)
          def checkout(path, pin):
              if path.exists():
                  return False
              path.mkdir(parents=True); run('git', 'init', '-q', path)
              run('git', '-C', path, 'fetch', '-q', '--depth=1', pin.get('mirror', pin['repository']), pin['commit'])
              run('git', '-C', path, 'checkout', '-q', '--detach', 'FETCH_HEAD')
              return True
          pins = json.loads((ROOT / 'scripts/data/adreno-compiler-inputs.json').read_text())
          mesa = ROOT / '.cache/mesa-work'
          if checkout(mesa, pins['mesa']):
              for patch in pins['patches']:
                  run('git', '-C', mesa, 'apply', ROOT / patch)
          tr = json.loads((ROOT / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']
          checkout(ROOT / '.cache/gpu-reference/metal2vulkan', tr)
          venv = ROOT / '.cache/mesa-venv'
          if not (venv / 'bin/python').is_file():
              run(sys.executable, '-m', 'venv', venv)
          run(venv / 'bin/python', '-m', 'pip', 'install', '-q', '-r', ROOT / 'scripts/requirements-adreno-compiler.txt')
          print('mesa', pins['mesa']['commit'], 'patches', len(pins['patches']), 'translator', tr['commit'])
          PY

      - name: Build Turnip for ios17e
        if: ${{ success() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cd out-ios17/fuxi/tree
          python3 scripts/build-turnip-darwin.py --target ios17e

      - name: Build Metal plugin for ios17e
        if: ${{ success() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cd out-ios17/fuxi/tree
          # f0ae963's drivers/AdrenoMetal is at c9ebd2fb (which needs translator 46e7cc96 + 0063/0064/0065),
          # while its ios17/scripts/build-adreno-metal-bridge.py still had the old 555b13d5 table.
          # Pull UniXNU 8542980's bridge script + translator pin (preserving f0ae963's plugin script with FuxiScanoutScaleAir.c!).
          cp scripts/build-adreno-metal-plugin.py "$RUNNER_TEMP/fuxi-plugin.py"
          U=8542980d02b4d2cc5c32ee3542de1760b2562aac; M="$RUNNER_TEMP/unixnu-main"; mkdir -p "$M/scripts/data"
          for f in scripts/build-adreno-metal-bridge.py scripts/build-adreno-metal-plugin.py scripts/macho-self-bind-weak-imports.py scripts/data/gpu-metal-vulkan-inputs.json; do
            curl -fsSL --retry 3 -o "$M/$f" "https://raw.githubusercontent.com/UniXNU/UniXNU/$U/$f"
          done
          python3 "$GITHUB_WORKSPACE/ci-self/.github/fuxi/metalup-port.py" scripts "$M"
          cp "$RUNNER_TEMP/fuxi-plugin.py" scripts/build-adreno-metal-plugin.py
          # 0065: 运行时用「字」粒度读被导入的宿主页 —— fuxi 的 surface 是 cache-inhibited 映射、
          # 基址只按 4/8 字节对齐，memcpy 的 16 字节 ldnp 会触发 SIGBUS(ESR DFSC 0x21) 把 backboardd 打死转圈。
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/translator-0065-copied-device-safe-page-reads.patch" \
             drivers/AdrenoMetal/bridge/patches/0065-copied-device-safe-page-reads.patch
          python3 - <<'P0065'
          from pathlib import Path
          p = Path('scripts/build-adreno-metal-bridge.py')
          s = p.read_text()
          if '0065-copied' not in s:
              old = ".patch']]\n"
              assert s.count(old) == 1, 'PATCHES list anchor'
              p.write_text(s.replace(old, ".patch',\n    '0065-copied-device-safe-page-reads.patch']]\n", 1))
              print('registered 0065 with the bridge')
          P0065
          # Minimal GpuScanoutPresenter.h optimizations: kSources 4->6 (match kernel 6 mappings) + 32x8 dual-wave dispatch
          python3 - <<'PGSP'
          from pathlib import Path
          gp = Path('drivers/AdrenoMetal/GpuScanoutPresenter.h')
          s = gp.read_text()
          s1 = 'static constexpr unsigned kSources = 4;'
          s2 = '[encoder dispatchThreadgroups:MTLSizeMake((scanout_.width + 15) / 16, (scanout_.height + 7) / 8, 1) threadsPerThreadgroup:MTLSizeMake(16, 8, 1)];'
          assert s.count(s1) == 1 and s.count(s2) == 1, (s.count(s1), s.count(s2))
          s = s.replace(s1, 'static constexpr unsigned kSources = 6;', 1)
          s = s.replace(s2, 'const NSUInteger tw = scale_.maxTotalThreadsPerThreadgroup >= 256 ? 32 : 16; [encoder dispatchThreadgroups:MTLSizeMake((scanout_.width + tw - 1) / tw, (scanout_.height + 7) / 8, 1) threadsPerThreadgroup:MTLSizeMake(tw, 8, 1)];', 1)
          gp.write_text(s)
          print('GpuScanoutPresenter.h: kSources=6 + 32x8 dispatch patched')
          PGSP
          # Add 0065-fuxi-ios-read-pages.patch (if not already present) for ios17e translator 46e7cc96
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/0065-fuxi-ios-read-pages.patch" drivers/AdrenoMetal/bridge/patches/
          python3 - <<'P65'
          from pathlib import Path
          b = Path('scripts/build-adreno-metal-bridge.py'); s = b.read_text()
          if '0065-fuxi-ios-read-pages.patch' not in s:
              old = "    '0064-copies-leave-unreachable-pages-alone.patch']]"
              assert s.count(old) == 1, 'bridge PATCHES table changed'
              b.write_text(s.replace(old, "    '0064-copies-leave-unreachable-pages-alone.patch',\n    '0065-fuxi-ios-read-pages.patch']]", 1))
              print('bridge: 0065 added')
          P65
          # Re-checkout metal2vulkan translator to the 46e7cc96 pin
          python3 - <<'PY2'
          import json, subprocess
          from pathlib import Path
          tr = json.loads(Path('scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']
          src = Path('.cache/gpu-reference/metal2vulkan')
          subprocess.run(['git', '-C', str(src), 'reset', '--hard', '-q'], check=True)
          subprocess.run(['git', '-C', str(src), 'clean', '-fdx', '-q'], check=True)
          subprocess.run(['git', '-C', str(src), 'fetch', '-q', '--depth=1', tr.get('mirror', tr['repository']), tr['commit']], check=True)
          subprocess.run(['git', '-C', str(src), 'checkout', '-q', '--detach', 'FETCH_HEAD'], check=True)
          print('translator ->', subprocess.check_output(['git', '-C', str(src), 'rev-parse', 'HEAD'], text=True).strip())
          PY2
          # Guard iOS 17 SDK shim enums that already exist in Xcode 26's iPhoneOS26.5.sdk MTLLibrary.h
          python3 - <<'PYENUM'
          from pathlib import Path
          p = Path('drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm')
          s = p.read_text()
          n = 0
          for line in (
              'enum {MTLMathModeSafe = 0, MTLMathModeRelaxed = 1, MTLMathModeFast = 2};',
              'enum {MTLMathFloatingPointFunctionsFast = 0, MTLMathFloatingPointFunctionsPrecise = 1};',
          ):
              if line in s:
                  s = s.replace(line, '// ' + line + ' /* in iPhoneOS26 SDK */')
                  n += 1
          p.write_text(s)
          print('guarded SDK26 enum shims:', n)
          # GpuScanoutPresenter.h weak-imports fuxi_scanout_scale_air, which ld64 refuses unless defined.
          # shaders/scanout_convert.ll already carries scanout_scale inside libadreno_metal_bridge.a (nmb_scanout_convert_air),
          # so call nmb_scanout_convert_air directly.
          gp = Path('drivers/AdrenoMetal/GpuScanoutPresenter.h')
          gs = gp.read_text()
          gs = gs.replace('extern "C" const void *fuxi_scanout_scale_air(size_t *length) __attribute__((weak_import));\n', '')
          gs = gs.replace('const bool own = [name isEqualToString:@"scanout_scale"] && fuxi_scanout_scale_air;', 'const bool own = false;')
          gs = gs.replace('const void *air = own ? fuxi_scanout_scale_air(&length) : nmb_scanout_convert_air(&length);', 'const void *air = nmb_scanout_convert_air(&length);')
          assert 'fuxi_scanout_scale_air' not in gs, 'fuxi_scanout_scale_air still referenced in GpuScanoutPresenter.h'
          gp.write_text(gs)
          print('GpuScanoutPresenter.h: using nmb_scanout_convert_air directly (includes scanout_scale)')
          PYENUM
          python3 scripts/build-adreno-metal-plugin.py --target ios17e --no-replay
          cd build
          if [ -d adreno-metal-plugin-ios17e ] && [ ! -e adreno-metal-plugin17e/NativeAdrenoMetal.bundle ]; then
            rm -rf adreno-metal-plugin17e; ln -s adreno-metal-plugin-ios17e adreno-metal-plugin17e
          fi
          ls -la adreno-metal-plugin17e/ adreno-metal-plugin17e/NativeAdrenoMetal.bundle | head -20

      - name: Install FuxiStatusBar-14p-120hz and build GPU addon
        if: ${{ success() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cp "$GITHUB_WORKSPACE/ci-self/.github/fuxi/FuxiStatusBar-14p-120hz.c" "$GITHUB_WORKSPACE/device-ios17/statusbar/FuxiStatusBar.c"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          python3 - "$GITHUB_WORKSPACE" "$SDK" <<'PY'
          import sys
          from pathlib import Path
          base, sdk = sys.argv[1], sys.argv[2]
          p = Path('out-ios17/fuxi/tree/scripts/build-fuxi-statusbar.py')
          s = p.read_text()
          s = s.replace("'/home/xiaomi/sadnut-fuxi-local-20261103'", repr(base))
          s = s.replace("'/home/xiaomi/sdk/iPhoneOS17-21H16.sdk'", repr(sdk))
          s = s.replace(
              "env['PATH'] = ':'.join(['/home/xiaomi/.local/bin', str(BASE / 'bin'), '/home/xiaomi/unixnu-linux/CommandLineTools/usr/bin', env['PATH']])",
              "env['PATH'] = env['PATH']")
          p.write_text(s)
          PY
          cd out-ios17/fuxi/tree
          mkdir -p build/ios17-addon
          ADRENO_PLUGIN_DIR=$PWD/build/adreno-metal-plugin17e python3 scripts/make-gpu-addon.py --publish build/ios17-addon/base.gpuaddon
          python3 scripts/build-fuxi-statusbar.py build/ios17-addon/base.gpuaddon build/ios17-addon/kernel.macho.gpuaddon
          cat build/adreno-metal-plugin17e/trust.json
          mkdir -p "$RUNNER_TEMP/addon-out"
          cp build/ios17-addon/kernel.macho.gpuaddon "$RUNNER_TEMP/addon-out/"
          cp build/adreno-metal-plugin17e/trust.json "$RUNNER_TEMP/addon-out/"

      - name: encrypt and upload
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          command -v age >/dev/null || exit 0
          K=$(find UniXNU/out-ios17 -path '*/kernel/kernel.macho' | head -1)
          if [ -n "$K" ]; then
            tar -C "$(dirname "$K")" -czf "$RUNNER_TEMP/k.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-kernel.tgz.age" "$RUNNER_TEMP/k.tgz"; rm -f "$RUNNER_TEMP/k.tgz"
          fi
          if [ -d "$RUNNER_TEMP/addon-out" ]; then
            tar -C "$RUNNER_TEMP/addon-out" -czf "$RUNNER_TEMP/a.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-gpuaddon.tgz.age" "$RUNNER_TEMP/a.tgz"; rm -rf "$RUNNER_TEMP/a.tgz" "$RUNNER_TEMP/addon-out"
          fi
          # 符号化材料：插件的 linker map 与 dSYM 都留在了构建目录里，一起带出来（P0 SIGBUS 定位需要）
          mkdir -p "$RUNNER_TEMP/sym"
          find UniXNU/out-ios17 -name 'NativeAdrenoMetal.map' -exec cp {} "$RUNNER_TEMP/sym/" \; 2>/dev/null || true
          for d in $(find UniXNU/out-ios17 -maxdepth 7 -name 'NativeAdrenoMetal.dSYM' 2>/dev/null); do cp -R "$d" "$RUNNER_TEMP/sym/" || true; done
          B=$(find UniXNU/out-ios17 -name 'NativeAdrenoMetal' -type f -size +1M 2>/dev/null | head -1)
          if [ -n "$B" ]; then
            cp "$B" "$RUNNER_TEMP/sym/NativeAdrenoMetal.stripped" || true
            llvm-nm -n "$B" > "$RUNNER_TEMP/sym/nm.txt" 2>&1 || true
            llvm-objdump --macho --private-headers "$B" > "$RUNNER_TEMP/sym/headers.txt" 2>&1 || true
          fi
          ls -la "$RUNNER_TEMP/sym" || true
          if [ -n "$(ls -A "$RUNNER_TEMP/sym" 2>/dev/null)" ]; then
            tar -C "$RUNNER_TEMP/sym" -czf "$RUNNER_TEMP/sym.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/symbols.tgz.age" "$RUNNER_TEMP/sym.tgz"
          fi

          find UniXNU/out-ios17 -name '*.log' -size -20M 2>/dev/null | tar -czf "$RUNNER_TEMP/logs.tgz" -T - 2>/dev/null || true
          [ -s "$RUNNER_TEMP/logs.tgz" ] && age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/logs.tgz.age" "$RUNNER_TEMP/logs.tgz"
          ls -la "$RUNNER_TEMP/up"
          rm -rf UniXNU/out-ios17/ipsw "$RUNNER_TEMP/kc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unixnu-fuxi-ios17-kernel
          path: ${{ runner.temp }}/up
          if-no-files-found: warn
